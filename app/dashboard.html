function thetaFor(v, side) {    // кут, за якого під краєм горлечка рівно v (монотонно спадає з кутом)
  let lo = 0, hi = 2.6;
  if (capUnderLip(side * lo) <= v) return 0;
  for (let k = 0; k < 28; k++) { const m = (lo + hi) / 2; if (capUnderLip(side * m) > v) lo = m; else hi = m; }
  return side * (lo + hi) / 2;
}

function bLayout() {
  const n = G.tubes.length, W = GB.W, per = Math.max(1, Math.min(n, Math.floor((W - 8) / B_SLOT)));
  const rows = Math.ceil(n / per), pos = [];
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / per), inRow = Math.min(per, n - r * per), j = i - r * per;
    const x0 = (W - inRow * B_SLOT) / 2 + B_SLOT / 2;
    pos.push([x0 + j * B_SLOT, B_TOPM + r * B_ROWH]);
  }
  GB.pos = pos;
  return B_TOPM + rows * B_ROWH - 30;
}

function gMountCanvas() {
  const box = document.querySelector("#g-bottles .gtubes"); if (!box) return;
  const cv = box.querySelector("canvas");
  GB.cv = cv; GB.ctx = cv.getContext("2d"); GB.dpr = window.devicePixelRatio || 1;
  GB.W = Math.max(280, box.clientWidth || 600);
  GB.H = bLayout();
  cv.width = GB.W * GB.dpr; cv.height = GB.H * GB.dpr; cv.style.width = GB.W + "px"; cv.style.height = GB.H + "px";
  cv.onclick = ev => {
    const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    const i = GB.pos.findIndex(([mx, my]) => x >= mx - B_BW - 8 && x <= mx + B_BW + 8 && y >= my - 24 && y <= my + B_LEN + 6);
    if (i >= 0) gClick(i);
  };
  if (!GB.raf) GB.raf = requestAnimationFrame(bFrame);
}

function bColor(name, fallback) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback; }

function bFrame(ts) {
  GB.raf = 0;
  if (!GB.cv || !document.body.contains(GB.cv)) return;
  GB.raf = requestAnimationFrame(bFrame);
  if (document.hidden || !GB.cv.offsetParent) return;
  const ctx = GB.ctx, now = performance.now();
  ctx.setTransform(GB.dpr, 0, 0, GB.dpr, 0, 0);
  ctx.clearRect(0, 0, GB.W, GB.H);
  const A = GB.anim, U = bUnit();
  const muted = bColor("--muted", "#6b7280"), accent = bColor("--accent", "#2563eb"), ok = bColor("--ok", "#15803d"), card = bColor("--card", "#fff");
  if (!GB.pat) { const pc = document.createElement("canvas"); pc.width = pc.height = 10; const x = pc.getContext("2d");
    x.fillStyle = "#4b5563"; x.fillRect(0, 0, 10, 10); x.strokeStyle = "#6b7280"; x.lineWidth = 3; x.beginPath(); x.moveTo(-2, 12); x.lineTo(12, -2); x.stroke(); GB.pat = ctx.createPattern(pc, "repeat"); }

  // стан анімації переливання
  let pose = null, srcVol = null, tgtExtra = 0, stream = null;
  if (A) {
    const t = now - A.t0, T1 = 380, T2 = A.T2, T3 = 380;
    const rest = GB.pos[A.a];
    const poseAt = th => { const lp = toWorld([lowerLip(th)], 0, 0, th)[0]; return [A.L[0] - lp[0], A.L[1] - lp[1], th]; };
    const pouredAt = tt => { if (tt <= T1) return 0; const k = Math.min(1, (tt - T1) / T2);
      const th = A.thA + (A.thB - A.thA) * easeIO(k); return Math.max(0, A.V0 - Math.min(A.V0, capUnderLip(th))); };
    if (t < T1) {
      const k = easeIO(t / T1), p1 = poseAt(A.thA * 0.98);
      pose = [rest[0] + (p1[0] - rest[0]) * k, rest[1] - B_LIFT + (p1[1] - rest[1] + B_LIFT) * k, p1[2] * k];
    } else if (t < T1 + T2) {
      const k = (t - T1) / T2, th = A.thA + (A.thB - A.thA) * easeIO(k);
      pose = poseAt(th);
    } else if (t < T1 + T2 + T3) {
      const k = easeIO((t - T1 - T2) / T3), p2 = poseAt(A.thB);
      pose = [p2[0] + (rest[0] - p2[0]) * k, p2[1] + (rest[1] - p2[1]) * k, p2[2] * (1 - k)];
    } else {
      GB.wave[A.a] = {t0: now, amp: 1.6}; GB.wave[A.b] = {t0: now, amp: 2.4};
      const done = A.resolve; GB.anim = null; done(); return;
    }
    const poured = pouredAt(t);
    srcVol = A.V0 - poured;
    const FALL = 110;                                   // час падіння струменя до поверхні в цілі
    tgtExtra = pouredAt(t - FALL);
    const rate = (pouredAt(t) - pouredAt(t - 50)) / 50; // об'єм за мс
    const tEnd = T1 + T2;
    if (t > T1 && t < tEnd + 160 && (rate > 1e-4 || t > tEnd)) {
      stream = {rate, tail: t > tEnd ? (t - tEnd) / 160 : 0};
    }
    GB.wave[A.b] = {t0: now, amp: Math.min(3.2, 0.6 + rate * 900), live: true};
  }

  const order = GB.pos.map((_, i) => i).filter(i => !A || i !== A.a);
  if (A) order.push(A.a);
  for (const i of order) {
    const t = G.tubes[i] || [], done = t.length === G.cap && t.every(c => c === t[0]);
    if (done && !(i in GB.corkT)) GB.corkT[i] = now; else if (!done) delete GB.corkT[i];
    const target = G.sel === i ? -B_LIFT : 0;
    GB.lift[i] = (GB.lift[i] || 0) + (target - (GB.lift[i] || 0)) * 0.25;
    let [mx, my] = GB.pos[i], th = 0;
    my += GB.lift[i];
    if (A && i === A.a && pose) [mx, my, th] = pose;
    const poly = toWorld(B_POLY, mx, my, th);
    // шари рідини (знизу вгору), обрізані об'ємом під час переливання
    let layers = t.map((c, j) => ({c, v: U, hid: j < (G.hid[i] || 0)}));
    if (A && i === A.a) { let left = srcVol; layers = layers.map(l => { const v = Math.max(0, Math.min(l.v, left)); left -= v; return {...l, v}; }).filter(l => l.v > 0.01); }
    if (A && i === A.b && tgtExtra > 0) layers.push({c: A.ci, v: tgtExtra, hid: false});
    const w = GB.wave[i]; let amp = 0, ph = now * 0.012;
    if (w) { const age = now - w.t0; amp = w.live ? w.amp : w.amp * Math.exp(-age / 420) * Math.cos(age * 0.018); if (!w.live && age > 1800) delete GB.wave[i]; else if (w.live) w.live = false; }
    ctx.save();
    ctx.beginPath(); poly.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fill();
    ctx.clip();
    let cum = 0, yBottom = levelFor(poly, 0);
    const xs = poly.map(q => q[0]), xmin = Math.min(...xs) - 4, xmax = Math.max(...xs) + 4;
    layers.forEach((l, k) => {
      cum += l.v;
      const yTop = levelFor(poly, cum), last = k === layers.length - 1;
      ctx.beginPath();
      if (last && Math.abs(amp) > 0.05) {     // хвиля на поверхні
        ctx.moveTo(xmin, yBottom + 1);
        for (let x = xmin; x <= xmax; x += 3) ctx.lineTo(x, yTop + amp * Math.sin(x * 0.22 + ph));
        ctx.lineTo(xmax, yBottom + 1);
      } else ctx.rect(xmin, yTop, xmax - xmin, yBottom - yTop + 1);
      ctx.fillStyle = l.hid ? GB.pat : G_COLORS[l.c]; ctx.fill();
      if (l.hid && yBottom - yTop > 12) {
        ctx.fillStyle = "#e5e7eb"; ctx.font = "bold 14px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("?", (xmin + xmax) / 2, (yTop + yBottom) / 2);
      }
      if (last) { ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.fillRect(xmin, yTop + (Math.abs(amp) > .05 ? amp * 0 : 0), xmax - xmin, 2.5); }
      yBottom = yTop;
    });
    ctx.restore();
    // скло: контур, відблиск, ободок
    ctx.save();
    ctx.translate(mx, my); ctx.rotate(th);
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-B_BW + 5, B_NL + B_SH + 6, 5, B_LEN - B_NL - B_SH - 34, 3) : ctx.rect(-B_BW + 5, B_NL + B_SH + 6, 5, 80); ctx.fill();
    ctx.restore();
    ctx.lineWidth = 2.4; ctx.lineJoin = "round";
    ctx.strokeStyle = G.sel === i ? accent : done ? ok : muted;
    ctx.beginPath(); poly.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    ctx.save(); ctx.translate(mx, my); ctx.rotate(th);
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-B_NW - 5, -5, 2 * B_NW + 10, 6, 3) : ctx.rect(-B_NW - 5, -5, 2 * B_NW + 10, 6);
    ctx.fillStyle = card; ctx.fill(); ctx.stroke();
    if (done) {                                // корок: падає з відскоком
      const ct = Math.min(1, (now - GB.corkT[i]) / 520), bounce = 1 - Math.pow(1 - ct, 3) * Math.cos(ct * Math.PI * 2.2);
      const dy = -34 * (1 - Math.min(1, bounce));
      const g = ctx.createLinearGradient(0, -14 + dy, 0, 10 + dy); g.addColorStop(0, "#c8946a"); g.addColorStop(1, "#7b5233");
      ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-B_NW - 1, -13 + dy, 2 * B_NW + 2, 22, 4) : ctx.rect(-B_NW - 1, -13 + dy, 2 * B_NW + 2, 22); ctx.fill();
    }
    ctx.restore();
  }

  // струмінь: від нижнього краю горлечка — парабола під дією сили тяжіння до поверхні в цілі
  if (A && stream) {
    const tp = GB.pos[A.b], tpoly = toWorld(B_POLY, tp[0], tp[1] + (GB.lift[A.b] || 0), 0);
    let vol = 0; G.tubes[A.b].forEach(() => { vol += U; }); vol += tgtExtra;
    const surf = levelFor(tpoly, vol);
    const [x0, y0] = A.L, g = 0.0024, vx = A.side * 0.02;   // px/мс², px/мс
    const width = Math.max(2.2, Math.min(7, 2 + stream.rate * 1400));
    const tf = Math.sqrt(2 * Math.max(4, surf - y0) / g);
    const tStart = stream.tail * tf;                         // хвіст відривається від горлечка й падає
    ctx.beginPath();
    for (let k = 0; k <= 24; k++) { const tt = tStart + (tf - tStart) * k / 24; const x = x0 + vx * tt, y = y0 + g * tt * tt / 2; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = G_COLORS[A.ci]; ctx.lineWidth = width; ctx.lineCap = "round"; ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = Math.max(1, width / 3); ctx.stroke();
  }
}

async function gAnimatePour(a, b, n, color) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !GB.cv) return;
  const U = bUnit(), V0 = G.tubes[a].length * U, P = n * U;
  const tp = GB.pos[b], sp = GB.pos[a], side = tp[0] >= sp[0] ? 1 : -1;
  const thA = thetaFor(V0, side), thB = thetaFor(V0 - P, side);
  const ci = G.tubes[a][G.tubes[a].length - 1];
  // нижній край горлечка — над горлечком цілі, трохи ближче до стінки з боку джерела
  const L = [tp[0] - side * 3, tp[1] - 16];
  return new Promise(res => { GB.anim = {a, b, n, ci, V0, side, thA, thB, L, T2: 420 + 360 * n, t0: performance.now(), resolve: res}; });
}

function gUndo() {
  if (!G.hist.length || G.won) return;
  const h = G.hist.pop(); G.tubes = h.tubes; G.hid = h.hid; G.moves = Math.max(0, G.moves - 1); G.clean = false; G.sel = -1; gRender();
}
function gRestart() { if (G.won) return; G.tubes = G.start.map(t => t.slice()); G.hid = G.startHid.slice(); G.hist = []; G.moves = 0; G.sel = -1; G.clean = false; gRender(); }  // куплені 🧪 лишаються
function gAddTube() {
  if (G.won || G.extra >= G_MAX_EXTRA || G.score < G_EXTRA_COST) return;
  G.score -= G_EXTRA_COST; G.extra++; G.clean = false; G.tubes.push([]); G.start.push([]); G.hid.push(0); G.startHid.push(0);
  gStore.set("score", G.score); gRender();
}

async function gWin() {
  G.won = true;
  const pts = gPoints(G.level) + (G.clean ? 25 : 0);
  G.score += pts;
  gStore.set("score", G.score); gStore.set("level", G.level + 1);
  G.hid = G.hid.map(() => 0);
  const msg = `${gBoss(G.level) ? "👑 Боса переможено!" : "🎉"} Рівень ${G.level} пройдено за ${G.moves} ходів! +${pts} очок${G.clean ? " (з бонусом за чисту гру)" : ""}`;
  gRender(msg);
  await gSync("score", {level: G.level, score: G.score});
  gRender(msg);
}

async function gSync(kind, extra = {}) {
  try {
    const body = {initData: G.tg, pid: G.pid, name: G.name, ...extra};
    const r = await fetch(`/api/game/${kind}?${new URLSearchParams({k: K})}`, {method: "POST", body: JSON.stringify(body)});
    const d = await r.json();
    G.top = d.top || G.top; if (d.me) G.me = d.me;
    if (d.checkers_top) CS.top = d.checkers_top; if (d.me && d.me.checkers) CS.stats = d.me.checkers;
  } catch (e) { /* без мережі — грати можна, рекорд запишеться наступного разу */ }
}

  if (!n || force) { n = (prompt("Як вас записати в рекорди?", n || "") || n || "Гравець").trim().slice(0, 24); gStore.set("name", n); }
  G.name = n; if (force) gSync("me").then(() => { gRender(); csRender(); });
}

// ================= ⛀ Шашки (звичні правила): 8×8, грають чорні поля; простá шашка ходить уперед на 1, б'є вперед і назад;
// бити обов'язково, кілька взяттів підряд — до кінця (можна обрати будь-який варіант, не обов'язково найдовший);
// дамка ходить і б'є по діагоналі на будь-яку відстань; шашка, що дійшла до останнього ряду під час взяття, стає дамкою
// і продовжує бити вже як дамка. Побиті шашки знімаються після ходу (через одну двічі не перестрибнути — «турецький удар»).
// Дошка — масив 64: 0 = a8 … 63 = h1; w/W — білі шашка/дамка (знизу, йдуть угору), b/B — чорні.
const CK = (() => {
  const DIRS = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  const on = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8, idx = (r, c) => r * 8 + c;
  const colorOf = p => !p ? null : p.toLowerCase();
  const isKing = p => p === "W" || p === "B";
  const name = i => "abcdefgh"[i & 7] + (8 - (i >> 3));

  function start() {
    const b = Array(64).fill("");
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) {
      if (r < 3) b[idx(r, c)] = "b"; else if (r > 4) b[idx(r, c)] = "w";
    }
    return {b, turn: "w", quiet: 0, keys: []};
  }

  // усі серії взяттів шашки з поля from (рекурсивно), кожна — {from, to, path, caps, promote}
  function captures(b, from, piece) {
    const col = colorOf(piece), out = [];
    const walk = (sq, king, caps, path) => {
      const [r, c] = [sq >> 3, sq & 7];
      let found = false;
      for (const [dr, dc] of DIRS) {
        if (king) {
          let rr = r + dr, cc = c + dc;
          while (on(rr, cc) && !b[idx(rr, cc)]) { rr += dr; cc += dc; }
          if (!on(rr, cc)) continue;
          const mid = idx(rr, cc);
          if (colorOf(b[mid]) === col || caps.includes(mid)) continue;
          let lr = rr + dr, lc = cc + dc;
          while (on(lr, lc) && !b[idx(lr, lc)]) {
            const land = idx(lr, lc); found = true;
            walk(land, true, caps.concat(mid), path.concat(land));
            lr += dr; lc += dc;
          }
        } else {
          const mr = r + dr, mc = c + dc, lr = r + 2 * dr, lc = c + 2 * dc;
          if (!on(lr, lc)) continue;
          const mid = idx(mr, mc), land = idx(lr, lc);
          if (!b[mid] || colorOf(b[mid]) === col || caps.includes(mid) || b[land]) continue;
          found = true;
          const promo = (col === "w" && lr === 0) || (col === "b" && lr === 7);
          walk(land, promo, caps.concat(mid), path.concat(land));
        }
      }
      if (!found && caps.length) {
        const to = path[path.length - 1], r2 = to >> 3;
        out.push({from, to, path, caps, promote: !isKing(piece) && (king || (col === "w" && r2 === 0) || (col === "b" && r2 === 7))});
      }
    };
    // на час пошуку шашка «знята» з початкового поля (через нього можна пройти дамкою)
    const saved = b[from]; b[from] = "";
    walk(from, isKing(piece), [], [from]);
    b[from] = saved;
    return out;
  }

  function legal(s) {
    const {b, turn} = s, caps = [], quiet = [];
    for (let i = 0; i < 64; i++) {
      const p = b[i]; if (!p || colorOf(p) !== turn) continue;
      caps.push(...captures(b, i, p));
      if (caps.length) continue;
      const [r, c] = [i >> 3, i & 7];
      for (const [dr, dc] of DIRS) {
        if (isKing(p)) {
          let rr = r + dr, cc = c + dc;
          while (on(rr, cc) && !b[idx(rr, cc)]) { quiet.push({from: i, to: idx(rr, cc), path: [i, idx(rr, cc)], caps: [], promote: false}); rr += dr; cc += dc; }
        } else {
          if ((turn === "w" && dr > 0) || (turn === "b" && dr < 0)) continue;   // проста шашка — лише вперед
          const rr = r + dr, cc = c + dc;
          if (on(rr, cc) && !b[idx(rr, cc)]) quiet.push({from: i, to: idx(rr, cc), path: [i, idx(rr, cc)], caps: [],
            promote: (turn === "w" && rr === 0) || (turn === "b" && rr === 7)});
        }
      }
    }
    return caps.length ? caps : quiet;
  }

  function make(s, m) {
    const b = s.b.slice(), p = b[m.from];
    b[m.from] = ""; m.caps.forEach(q => { b[q] = ""; });
    b[m.to] = m.promote ? p.toUpperCase() : p;
    return {b, turn: s.turn === "w" ? "b" : "w", quiet: m.caps.length || !isKing(p) ? 0 : s.quiet + 1, keys: s.keys};
  }
  const posKey = s => s.b.map(p => p || ".").join("") + s.turn;
  function play(s, m) { const n = make(s, m); n.keys = s.keys.concat([posKey(s)]); return n; }

  function status(s) {
    const moves = legal(s);
    if (!moves.length) return {over: true, result: s.turn === "w" ? "b" : "w",
      why: s.b.some(p => colorOf(p) === s.turn) ? "немає ходів" : "усі шашки побито"};
    if (s.quiet >= 30) return {over: true, result: "d", why: "15 ходів лише дамками без взяття"};
    const k = posKey(s);
    if (s.keys.filter(x => x === k).length >= 2) return {over: true, result: "d", why: "триразове повторення"};
    return {over: false, mustCapture: moves[0].caps.length > 0, moves};
  }

  function evaluate(b) { // з погляду білих
    let v = 0;
    for (let i = 0; i < 64; i++) {
      const p = b[i]; if (!p) continue;
      const r = i >> 3, c = i & 7, centre = (c >= 2 && c <= 5 && r >= 2 && r <= 5) ? 6 : 0;
      let x;
      if (p === "w") x = 100 + (7 - r) * 5 + centre + (r === 7 ? 8 : 0);    // задній ряд тримає оборону
      else if (p === "b") x = 100 + r * 5 + centre + (r === 0 ? 8 : 0);
      else x = 300 + centre;
      v += colorOf(p) === "w" ? x : -x;
    }
    return v;
  }

  function negamax(s, depth, alpha, beta, ply, ctx) {
    ctx.nodes++;
    const moves = legal(s);
    if (!moves.length) return -100000 + ply;
    if (depth <= 0 && !moves[0].caps.length) return (s.turn === "w" ? 1 : -1) * evaluate(s.b);
    if (depth <= -4) return (s.turn === "w" ? 1 : -1) * evaluate(s.b);   // обов'язкові взяття дораховуємо, але не безкінечно
    moves.sort((x, y) => y.caps.length - x.caps.length);
    let best = -Infinity;
    for (const m of moves) {
      const sc = -negamax(make(s, m), depth - 1, -beta, -alpha, ply + 1, ctx);
      if (sc > best) best = sc;
      if (sc > alpha) alpha = sc;
      if (alpha >= beta || ctx.nodes > ctx.limit) break;
    }
    return best;
  }

  const LEVELS = {easy: {depth: 2, noise: 60}, medium: {depth: 5, noise: 8}, hard: {depth: 8, noise: 0}};
  function bestMove(s, level = "medium") {
    const L = LEVELS[level] || LEVELS.medium, ctx = {nodes: 0, limit: 400000};
    const moves = legal(s);
    let best = null, bestSc = -Infinity, alpha = -Infinity;
    for (const m of moves) {
      let sc = -negamax(make(s, m), L.depth - 1, -Infinity, -alpha, 1, ctx);
      if (L.noise) sc += (Math.random() - 0.5) * 2 * L.noise;
      if (sc > bestSc) { bestSc = sc; best = m; }
      if (sc > alpha) alpha = sc;
    }
    return best;
  }

  return {start, legal, play, make, status, bestMove, colorOf, isKing, name, evaluate};
})();

// ---- інтерфейс шашок (гравець проти комп'ютера), анімації, результати в базу
const CS = {s: null, hist: [], sel: -1, level: "medium", side: "w", busy: false, last: null, over: null, ready: false, stats: null, top: []};
const LEVEL_UA = {easy: "Легко", medium: "Середньо", hard: "Складно"};
const csStore = {get(k, d) { try { const v = localStorage.getItem("tuyahome.checkers." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tuyahome.checkers." + k, JSON.stringify(v)); } catch (e) {} }};
const csPos = sq => { let r = sq >> 3, c = sq & 7; if (CS.side === "b") { r = 7 - r; c = 7 - c; } return [r, c]; };

function csNew() {
  CS.s = CK.start(); CS.hist = []; CS.sel = -1; CS.last = null; CS.over = null; CS.busy = false;
  csSave(); csRender();
  if (CS.side === "b") csAi();
}
function csSave() { csStore.set("game", {s: CS.s, hist: CS.hist.slice(-200), last: CS.last, over: CS.over, level: CS.level, side: CS.side}); }

function csStatus() {
  const st = CK.status(CS.s);
  if (st.over && !CS.over) {
    CS.over = st;
    csSync("checkers", {result: st.result === "d" ? "draw" : st.result === CS.side ? "win" : "loss", level: CS.level});
  }
  return st;
}

function csRender() {
  const el = document.getElementById("g-checkers"); if (!el || !CS.ready) return;
  const st = CS.over || CK.status(CS.s);
  const legal = st.over ? [] : st.moves;
  const mine = !st.over && CS.s.turn === CS.side && !CS.busy;
  const targets = CS.sel >= 0 ? legal.filter(m => m.from === CS.sel) : [];
  const movable = mine ? new Set(legal.map(m => m.from)) : new Set();
  let squares = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const sq = CS.side === "b" ? (7 - r) * 8 + (7 - c) : r * 8 + c;
    const dark = (r + c) % 2 === 1, t = targets.find(m => m.to === sq);
    const cls = ["csq", dark ? "dk" : "lt", CS.last && CS.last.path && CS.last.path.includes(sq) ? "lastm" : "", CS.sel === sq ? "seld" : "",
      t ? "dot" : "", mine && st.mustCapture && movable.has(sq) ? "must" : ""].join(" ");
    const coord = (c === 0 ? `<em class="rk">${8 - (sq >> 3)}</em>` : "") + (r === 7 ? `<em class="fl">${"abcdefgh"[sq & 7]}</em>` : "");
    squares += `<div class="${cls}" data-sq="${sq}">${coord}</div>`;
  }
  let pieces = "";
  CS.s.b.forEach((p, sq) => {
    if (!p) return;
    const [r, c] = csPos(sq);
    pieces += `<span class="pc ${CK.colorOf(p)} ${CK.isKing(p) ? "king" : ""}" data-sq="${sq}" style="transform:translate(${c * 100}%,${r * 100}%)"><i></i></span>`;
  });
  const cnt = col => CS.s.b.filter(p => CK.colorOf(p) === col).length;
  const me = CS.side, ai = me === "w" ? "b" : "w";
  let msg;
  if (CS.over) {
    const r = CS.over.result;
    msg = r === "d" ? `🤝 Нічия — ${CS.over.why}` : r === me ? `🎉 Перемога! (у суперника ${CS.over.why})` : `😔 Поразка — у вас ${CS.over.why}`;
  } else if (CS.busy && CS.s.turn !== me) msg = "🤔 Комп'ютер думає…";
  else msg = CS.s.turn === me ? (st.mustCapture ? "⚔️ Ваш хід — треба бити!" : "Ваш хід") : "Хід комп'ютера";
  const s = CS.stats || {};
  const line = lv => { const x = s[lv] || {}; return `${LEVEL_UA[lv]}: ${x.w || 0}–${x.l || 0}–${x.d || 0}`; };
  const top = CS.top.length ? CS.top.map((t, i) => `<li><b>${i + 1}.</b> ${PV(esc(t.name || "—"))}<span>${t.pts} оч. · ${t.w} перемог</span></li>`).join("")
    : `<li class="muted">Ще немає перемог — будьте першим!</li>`;
  el.innerHTML = `
    <div class="cs-ctl"><span class="seg" id="cs-level">${Object.entries(LEVEL_UA).map(([k, v]) => `<button data-l="${k}" class="${k === CS.level ? "on" : ""}">${v}</button>`).join("")}</span>
      <span class="seg" id="cs-side"><button data-s="w" class="${me === "w" ? "on" : ""}">⚪ Білими</button><button data-s="b" class="${me === "b" ? "on" : ""}">⚫ Чорними</button></span></div>
    <div class="cs-msg ${CS.over ? (CS.over.result === me ? "win" : CS.over.result === "d" ? "draw" : "loss") : st.mustCapture && CS.s.turn === me ? "check" : ""}">${msg}</div>
    <div class="cs-caps">Суперник: ${cnt(ai)} шаш.</div>
    <div class="cs-board ck" id="cs-board">${squares}<div class="cs-pieces">${pieces}</div></div>
    <div class="cs-caps">Ви: ${cnt(me)} шаш.</div>
    <div class="gctl"><button id="cs-new">♻️ Нова партія</button><button id="cs-undo" ${CS.hist.length && !CS.busy ? "" : "disabled"}>↶ Скасувати хід</button></div>
    <p class="small muted">Бити обов'язково (такі шашки підсвічено), кілька взяттів — до кінця; шашка б'є й назад, на останньому ряду стає дамкою (👑) і ходить на будь-яку відстань. Ваші результати (перемоги–поразки–нічиї): ${line("easy")} · ${line("medium")} · ${line("hard")}. Перемога: Легко — 1 очко, Середньо — 2, Складно — 3.</p>
    <h3 class="gtop-h">🏆 Рекорди в шашках</h3><ol class="gtop">${top}</ol>`;
  // клітинку визначаємо за точкою натиску на дошці: працює будь-де в межах клітинки й під шашкою
  el.querySelector("#cs-board").onclick = ev => {
    const bd = ev.currentTarget.getBoundingClientRect();
    const c = Math.floor((ev.clientX - bd.left) / bd.width * 8), r = Math.floor((ev.clientY - bd.top) / bd.height * 8);
    if (r < 0 || r > 7 || c < 0 || c > 7) return;
    csClick(CS.side === "b" ? (7 - r) * 8 + (7 - c) : r * 8 + c);
  };
  el.querySelectorAll("#cs-level button").forEach(b => b.onclick = () => { CS.level = b.dataset.l; csStore.set("level", CS.level); csSave(); csRender(); });
  el.querySelectorAll("#cs-side button").forEach(b => b.onclick = () => {
    if (b.dataset.s === CS.side) return;
    if (CS.hist.length && !CS.over && !confirm("Почати нову партію іншим кольором?")) return;
    CS.side = b.dataset.s; csStore.set("side", CS.side); csNew(); });
  el.querySelector("#cs-new").onclick = () => { if (!CS.over && CS.hist.length > 1 && !confirm("Почати нову партію? Поточну буде втрачено.")) return; csNew(); };
  el.querySelector("#cs-undo").onclick = csUndo;
}

function csClick(sq) {
  if (CS.busy || CS.over || CS.s.turn !== CS.side) return;
  const p = CS.s.b[sq];
  if (CS.sel >= 0) {
    const m = CK.legal(CS.s).find(m => m.from === CS.sel && m.to === sq);
    if (m) { CS.sel = -1; return csMove(m); }
  }
  const can = CK.legal(CS.s).some(m => m.from === sq);
  CS.sel = p && CK.colorOf(p) === CS.side && can && CS.sel !== sq ? sq : -1;
  csRender();
}

const csWait = ms => new Promise(r => setTimeout(r, ms));
// анімація: шашка ковзає по кожному стрибку, побиті — зникають одна за одною; перетворення на дамку — спалах і корона
async function csAnimate(m) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.querySelector("#cs-board .cs-pieces"); if (!box) return;
  const at = sq => box.querySelector(`.pc[data-sq="${sq}"]`);
  const e = at(m.from); if (!e) return;
  e.classList.add("moving");
  for (let k = 1; k < m.path.length; k++) {
    const [r, c] = csPos(m.path[k]);
    e.style.transform = `translate(${c * 100}%,${r * 100}%)`;
    if (m.caps.length) { e.classList.add("hop"); }
    await csWait(m.caps.length ? 260 : 300);
    e.classList.remove("hop");
    if (m.caps[k - 1] != null) { const t = at(m.caps[k - 1]); if (t) t.classList.add("taken"); }
  }
  if (m.promote) { e.classList.add("king", "promoted"); await csWait(450); }
}

async function csMove(m) {
  CS.busy = true; CS.sel = -1; csRender();
  await csAnimate(m);
  CS.hist.push(CS.s); CS.s = CK.play(CS.s, m); CS.last = {from: m.from, to: m.to, path: m.path};
  CS.busy = false;
  const st = csStatus(); csSave(); csRender();
  if (!st.over && CS.s.turn !== CS.side) csAi();
}

async function csAi() {
  CS.busy = true; csRender();
  await csWait(300);
  const t0 = performance.now();
  const m = CK.bestMove(CS.s, CS.level);
  const spent = performance.now() - t0;
  if (spent < 400) await csWait(400 - spent);
  if (m) { CS.busy = false; await csMove(m); } else CS.busy = false;
}

function csUndo() {
  if (CS.busy || !CS.hist.length) return;
  // назад до свого ходу: хід комп'ютера і свій
  CS.s = CS.hist.pop();
  while (CS.hist.length && CS.s.turn !== CS.side) CS.s = CS.hist.pop();
  CS.over = null; CS.last = null; CS.sel = -1; csSave(); csRender();
  if (CS.s.turn !== CS.side) csAi();
}

async function csSync(kind, extra = {}) {
  try {
    const body = {initData: G.tg, pid: G.pid, name: G.name, ...extra};
    const r = await fetch(`/api/game/${kind}?${new URLSearchParams({k: K})}`, {method: "POST", body: JSON.stringify(body)});
    const d = await r.json();
    if (d.me) CS.stats = d.me.checkers || CS.stats;
    if (d.checkers_top) CS.top = d.checkers_top;
    if (kind !== "me") csRender();
  } catch (e) { /* без мережі — грати можна */ }
}

async function initCheckers() {
  const el = document.getElementById("g-checkers");
  if (CS.ready) return csRender();
  CS.ready = true;
  el.innerHTML = `<div class="hload"><div class="spin"></div>Розставляємо шашки…</div>`;
  await gIdentity();
  CS.level = csStore.get("level", "medium"); CS.side = csStore.get("side", "w");
  const saved = csStore.get("game", null);
  if (saved && saved.s && saved.s.b && saved.s.b.length === 64) Object.assign(CS, {s: saved.s, hist: saved.hist || [], last: saved.last, over: saved.over, side: saved.side || CS.side});
  else CS.s = CK.start();
  if (G.me) { CS.stats = G.me.checkers || null; }
  await csSync("me");
  csRender();
  if (!CS.over && CS.s.turn !== CS.side) csAi();
}

async function renderSchedule() {
  const sc = S.schedule, el = document.getElementById("sched");
  if (!sc || !sc.days.length) { el.hidden = true; return; }
  el.hidden = false;
  const A = await api("/api/actual").catch(() => ({now: S.now, off: [], unknown: []}));
  const next = sc.next_off;
  const nextTxt = next ? (next[0] <= S.now ? `Зараз за графіком світла немає — до ${hhmm(next[1])}`
    : `Наступне відключення: ${fmtT(next[0], 1)}–${hhmm(next[1])} (через ${dur(next[0] - S.now)})`) : "Відключень за графіком немає";
  const rows = sc.days.map(d => {
    const nowPos = S.now >= d.day && S.now < d.day + 864e5 ? `<span class="now" style="left:${(S.now - d.day) / 864e5 * 100}%"></span>` : "";
    const off = d.off.map(([a, b]) => `${fmtT(a)}–${hhmm(b)}`).join(", ") || "без відключень";
    return `<div class="sched-day"><div class="lbl">${esc(d.label)}<span>${esc(off)}</span></div>
      <div class="bars"><span class="cap">ДТЕК</span><div class="bar48">${d.slots.map(s => `<i class="${s === "on" ? "" : s}"></i>`).join("")}${nowPos}</div>
      <span class="cap">Факт</span>${factBar(d.day, A)}</div></div>`;
  }).join("");
  el.innerHTML = `<div class="sec-head"><h2>Графік відключень · черга ${PV(esc(sc.group))}</h2>
      <span class="small muted">${PV(esc(sc.address))} · ДТЕК оновив ${esc(sc.update || "—")}</span></div>
    <div class="next">${nextTxt}</div>${S.sched_acc ? `<div class="small muted" style="margin:-2px 0 8px">📊 Точність графіка ДТЕК для черги: ${esc(S.sched_acc[0].toLowerCase() + S.sched_acc.slice(1))}</div>` : ""}${rows}
    <div class="ticks">${[0,3,6,9,12,15,18,21].map(h => `<span class="${h % 6 ? "x" : ""}">${String(h).padStart(2,"0")}:00</span>`).join("")}</div>
    <div class="legend"><span><i></i>світло є</span><span><i class="off"></i>світла немає</span><span><i class="maybe"></i>можливе відключення</span>
      <span><i style="background:var(--muted);opacity:.45"></i>факт невідомий (немає інтернету)</span>
      <span><i style="background:repeating-linear-gradient(45deg,var(--grid) 0 3px,transparent 3px 6px);border:1px solid var(--line)"></i>немає даних</span></div>`;
}

function analogSeries() {
  const list = [];
  for (const dev of S.devices) for (const d of dev.dps) if (isAnalog(d)) list.push({dev, d, key: `${dev.id}:${d.code}`});
  // напруга першою, далі температура, вологість, решта
  const rank = c => /voltage/.test(c) ? 0 : /temp/.test(c) ? 1 : /humid|content/.test(c) ? 2 : 3;
  return list.sort((a, b) => rank(a.d.code) - rank(b.d.code) || (b.dev.online - a.dev.online));
}

function chartSvg(box, pts, d, opts) {
  const W = Math.max(300, box.clientWidth || 600), H = W > 600 ? 200 : 160, L = 40, R = 6, T = 8, B = 20;
  const t0 = S.now - range * 36e5, t1 = S.now;
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  const th = opts.thresholds || [];
  if (th.length) { lo = Math.min(lo, th[0] + 10); hi = Math.max(hi, th[1] + 2); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let path = "";
  pts.forEach(([t, v], i) => { path += (i ? "L" : "M") + `${x(t).toFixed(1)},${y(v).toFixed(1)}`; });
  const ticks = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>
    <text x="${L - 5}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${+v.toFixed(1)}</text>`).join("");
  const thr = th.filter(v => v >= lo && v <= hi).map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bad)" stroke-dasharray="4 4" opacity=".7"/>`).join("");
  const xs = W > 500 ? [0, .25, .5, .75, 1] : [0, .5, 1];
  const xl = xs.map((f, i) => { const t = t0 + (t1 - t0) * f;
    return `<text x="${x(t)}" y="${H - 5}" font-size="10" fill="var(--muted)" text-anchor="${i === 0 ? "start" : i === xs.length - 1 ? "end" : "middle"}">${fmtT(t, range > 24)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label(d))}">${ticks}${thr}
    <path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round"/>${xl}</svg>`;
}

// Графіки згорнуті; розгортаються натиском на заголовок. Що розгорнуто — пам'ятає браузер.
// Під час автооновлення картки не перебудовуються (лише значення й розгорнуті графіки) — нічого не блимає.
const OPEN_KEY = "tuyahome.charts.open";
let openCharts = new Set();
try { openCharts = new Set(JSON.parse(localStorage.getItem(OPEN_KEY) || "[]")); } catch (e) {}
const saveOpen = () => { try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openCharts])); } catch (e) {} };
let chartKeys = "";

async function drawChart(card, s) {
  const box = card.querySelector(".box"), note = card.querySelector(".ch-note");
  const off = s.dev.online ? "" : ` · прилад офлайн ${dur(S.now - (s.dev.offline_since || S.now))}`;
  const {series: hist} = await api("/api/series", {s: s.key, h: range});
  const pts = (hist[s.key] || []).filter(p => typeof p[1] === "number");
  if (pts.length < 2) { box.innerHTML = ""; note.textContent = `Історія накопичується${off}`; return; }
  box.innerHTML = chartSvg(box, pts, s.d, {thresholds: /voltage/.test(s.d.code) ? [S.thresholds.voltage_low, S.thresholds.voltage_high] : []});
  const vals = pts.map(p => p[1]);
  note.textContent = `мін ${Math.min(...vals)} · макс ${Math.max(...vals)} ${unit(s.d.unit)} · ${pts.length} точок${off}`;
}

const isTemp = c => /temp/.test(c), isHum = c => /humid|prm_content/.test(c);
function chartCard(s, order) {
  return `<div class="card chart ${openCharts.has(s.key) ? "open" : ""}" data-chart="${esc(s.key)}" data-pair="${isTemp(s.d.code) || isHum(s.d.code) ? s.dev.id : ""}" style="order:${order}">
      <div class="ch-head"><span class="chev">▶</span><span class="name">${esc(label(s.d))} · ${esc(s.dev.name)}</span><button class="info" data-devinfo="${s.dev.id}" title="Усе про прилад">ⓘ</button>
        <span class="val"></span></div>
      <div class="body"><div class="box"></div><div class="ch-note"></div></div></div>`;
}
const emptyCard = (txt, order) => `<div class="card chart empty" style="order:${order}"><div class="ch-head"><span class="name">${esc(txt)}</span><span class="val">—</span></div></div>`;

async function renderCharts(redraw = true) {
  const series = analogSeries(), wrap = document.getElementById("charts");
  const keys = series.map(s => s.key).join(",");
  if (keys !== chartKeys) {   // набір рядів змінився — будуємо каркас заново
    chartKeys = keys;
    // пари по приміщенню (приладу): температура | вологість; порядок — кімнати Smart Life, далі назва
    const rooms = S.tuya_room_order || [], roomOf = id => (S.tuya_rooms || {})[id];
    const devs = [...new Map(series.filter(s => isTemp(s.d.code) || isHum(s.d.code)).map(s => [s.dev.id, s.dev])).values()]
      .sort((a, b) => ((rooms.indexOf(roomOf(a.id)) + 1 || 999) - (rooms.indexOf(roomOf(b.id)) + 1 || 999)) || a.name.localeCompare(b.name, "uk"));
    let t = "", h = "";
    devs.forEach((dev, i) => {
      const ts = series.find(s => s.dev.id === dev.id && isTemp(s.d.code)), hs = series.find(s => s.dev.id === dev.id && isHum(s.d.code));
      t += ts ? chartCard(ts, i * 2) : emptyCard(`Температура · ${dev.name}: немає`, i * 2);
      h += hs ? chartCard(hs, i * 2 + 1) : emptyCard(`Вологість · ${dev.name}: немає`, i * 2 + 1);
    });
    const other = series.filter(s => !isTemp(s.d.code) && !isHum(s.d.code)).map((s, i) => chartCard(s, i)).join("");
    wrap.innerHTML = `<div class="ccol pair"><h3>🌡️ Температура</h3>${t}</div><div class="ccol pair"><h3>💧 Вологість</h3>${h}</div>`
      + `<div class="ccol other"><h3>⚡ Напруга та інше</h3>${other}</div>`;
  }
  const jobs = [];
  for (const s of series) {
    const card = wrap.querySelector(`[data-chart="${CSS.escape(s.key)}"]`);
    card.querySelector(".val").innerHTML = `${s.d.value}<small>${esc(unit(s.d.unit))}</small>${s.dev.online ? "" : ` <small>офлайн</small>`}`;
    card.classList.toggle("offline", !s.dev.online);  // прилад не в мережі — картка сіра (значення останнє відоме)
    if (redraw && openCharts.has(s.key)) jobs.push(drawChart(card, s));
  }
  await Promise.all(jobs);
}

document.getElementById("charts").addEventListener("click", e => {
  const info = e.target.closest("[data-devinfo]"); if (info) { openDevice(info.dataset.devinfo); return; }
  const head = e.target.closest(".ch-head"); if (!head) return;
  const wrap = document.getElementById("charts"), card = head.closest(".chart");
  if (card.classList.contains("empty")) return;
  const open = !card.classList.contains("open");
  // температура й вологість одного приміщення розгортаються разом, щоб рядок лишався рівним
  const pair = card.dataset.pair;
  const group = pair ? [...wrap.querySelectorAll(`.chart[data-pair="${CSS.escape(pair)}"]`)] : [card];
  for (const c of group) {
    c.classList.toggle("open", open);
    const key = c.dataset.chart;
    open ? openCharts.add(key) : openCharts.delete(key);
    if (open) { const s = analogSeries().find(x => x.key === key); if (s) drawChart(c, s); }
  }
  saveOpen();
});

// основний статус приладу для картки: тривожний/дискретний стан, інакше клімат або напруга
const MAIN = ["watersensor_state","gas_sensor_status","gas_sensor_state","smoke_sensor_status","smoke_sensor_state",
  "prm_switch","doorcontact_state","master_state","switch","switch_on","switch_1","pir","switch_mode1","switch_type_1"];
function mainStatus(dev) {
  for (const c of MAIN) { const d = dev.dps.find(x => x.code === c); if (d) {
    const v = String(d.value).toLowerCase();
    return [`${label(d)}: ${show(dev, d)}`, v === "alarm" ? "alarm" : v === "normal" ? "ok" : ""]; } }
  const t = dev.dps.find(d => /temp/.test(d.code) && typeof d.value === "number" && !/compens/.test(d.code));
  const h = dev.dps.find(d => /humid|prm_content/.test(d.code) && typeof d.value === "number");
  if (t || h) return [[t && `${t.value} °C`, h && `${h.value} %`].filter(Boolean).join(" · "), ""];
  const v = dev.dps.find(d => /voltage/.test(d.code)); if (v) return [`${v.value} В`, ""];
  return ["", ""];
}

function renderDevices() {
  const power = new Set(S.power_ids || []);
  const order = d => d.dps.some(x => String(x.value).toLowerCase() === "alarm") ? -1 : d.gateway ? 0 : power.has(d.id) ? 1
    : d.dps.some(x => /water|gas|smoke/.test(x.code)) ? 2 : 3;
  // групи за кімнатами Smart Life — у порядку кімнат зі Smart Life; без кімнати — в кінці
  const roomOf = d => (S.tuya_rooms || {})[d.id] || "Без кімнати";
  const roomOrder = [...(S.tuya_room_order || []), "Без кімнати"];
  const groups = {};
  for (const d of S.devices.filter(d => !d.dps.some(isAnalog))) (groups[roomOf(d)] ||= []).push(d);
  const names = Object.keys(groups).sort((a, b) => {
    const alarm = n => groups[n].some(d => d.dps.some(x => String(x.value).toLowerCase() === "alarm")) ? 0 : 1;
    const ia = roomOrder.indexOf(a), ib = roomOrder.indexOf(b);
    return alarm(a) - alarm(b) || (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  document.getElementById("devices").innerHTML = names.map(room => {
    const devs = groups[room].sort((a, b) => order(a) - order(b) || a.name.localeCompare(b.name, "uk"));
    return `<div class="room-head">${esc(room)} <span>${devs.length}</span></div>` + devs.map(dev => devCard(dev, power)).join("");
  }).join("");
}

function devCard(dev, power) {
  {
    const bat = dev.dps.find(d => BATTERY.test(d.code) && typeof d.value === "number");
    const batTxt = bat ? `<span class="${bat.value < 20 ? "low" : ""}">🔋 ${bat.value}${bat.value <= 100 ? " %" : ""}</span>` : "";
    const st = dev.online ? "онлайн" : `офлайн ${dev.offline_since ? dur(S.now - dev.offline_since) : ""}`;
    const [main, cls] = mainStatus(dev);
    const tag = dev.gateway ? `<span class="tag key">інтернет</span>` : power.has(dev.id) ? `<span class="tag key">світло</span>` : "";
    return `<div class="card dev" data-dev="${dev.id}"><div class="dev-head"><span class="dot ${dev.online ? "" : "off"}"></span>
      <span class="dev-name">${ICON[dev.category] || ""} ${esc(dev.name)}</span>${tag}</div>
      <div class="dev-sub"><span>${st}</span>${batTxt}</div>${main ? `<div class="main ${cls}">${esc(main)}</div>` : ""}</div>`;
  }
}

// --- вікно приладу: усе, що можна витягнути з Tuya
const INFO_LABEL = {product_id:"ID продукту", model:"Модель", uuid:"UUID", node_id:"Zigbee node", ip:"IP (зовнішній)",
  time_zone:"Часовий пояс", active_time:"Активовано", create_time:"Додано", update_time:"Оновлено в Tuya", biz_type:"biz_type",
  owner_id:"ID дому", lat:"Широта", lon:"Довгота", icon:"Іконка"};
const fmtSec = v => typeof v === "number" ? fmtT(v < 1e12 ? v * 1000 : v, 1) : v;
async function openDevice(id) {
  const M = document.getElementById("modal"), body = document.getElementById("sheet");
  body.innerHTML = `<div class="top"><h3>…</h3><button class="x" data-close>×</button></div>`; M.classList.add("on");
  let r; try { r = await api("/api/device", {id}); } catch (e) { body.innerHTML += `<p>Не вдалося завантажити: ${esc(e.message)}</p>`; return; }
  const dev = r.device, model = r.model || {};
  const bat = dev.dps.find(d => BATTERY.test(d.code) && typeof d.value === "number");
  const rng = d => d.range ? d.range.join(" / ") : (d.min !== undefined || d.max !== undefined)
    ? `${d.min ?? ""}…${d.max ?? ""}${d.scale ? ` (÷10^${d.scale})` : ""}` : "";
  const rows = dev.dps.map(d => { const m = model[d.code] || {}, a = String(d.value).toLowerCase();
    return `<tr><td>${esc(LABEL[d.code] || d.code)}${m.name || d.name ? `<br><code>${esc(m.name || d.name)}</code>` : ""}</td>
      <td class="v" style="color:${a === "alarm" ? "var(--bad)" : a === "normal" ? "var(--ok)" : "inherit"}">${esc(show(dev, d))}</td>
      <td><code>${esc(JSON.stringify(d.raw))}</code></td><td><code>${esc(d.code)}</code><br><code>DP ${d.dp_id ?? "—"}</code></td>
      <td>${esc(d.type || "")}${d.unit ? ` · ${esc(unit(d.unit))}` : ""}</td><td>${esc(rng(d))}</td>
      <td>${d.access === "rw" || d.access === "wr" ? "читання + зміна" : d.access === "ro" ? "лише читання" : esc(d.access || "")}</td></tr>`; }).join("");
  const info = Object.entries(dev.info || {}).map(([k, v]) => `<span>${esc(INFO_LABEL[k] || k)}</span><span>${esc(/time$/.test(k) ? fmtSec(v) : v)}</span>`).join("");
  const analog = dev.dps.filter(d => typeof d.value === "number" && !BATTERY.test(d.code) && !SETTINGS.test(d.code));
  body.innerHTML = `<div class="top"><span style="font-size:26px">${ICON[dev.category] || "●"}</span><h3>${esc(dev.name)}</h3><button class="x" data-close>×</button></div>
    <div><span class="pill ${dev.online ? "on" : "off"}">${dev.online ? "онлайн" : "офлайн"}${dev.online && dev.online_since ? ` з ${fmtT(dev.online_since, 1)}` : !dev.online && dev.offline_since ? ` ${dur(r.now - dev.offline_since)}` : ""}</span>
      ${bat ? `<span class="pill ${bat.value < 20 ? "off" : ""}">🔋 ${bat.value}${bat.value <= 100 ? " %" : ""}</span>` : ""}
      ${r.tuya_room ? `<span class="pill">кімната: ${esc(r.tuya_room)}</span>` : `<span class="pill">кімната не задана в Smart Life</span>`}
      <span class="pill">${dev.gateway ? "хаб" : dev.mains ? "живлення від мережі" : "батарея"}</span>${dev.sub ? `<span class="pill">Zigbee через хаб</span>` : ""}
      <span class="pill">${esc(dev.product || "")}</span><span class="pill">категорія ${esc(dev.category)}</span></div>
    <h4>Параметри (${dev.dps.length})</h4>
    <div class="scroll"><table class="tbl"><tr><th>Параметр</th><th>Значення</th><th>Сире</th><th>Код</th><th>Тип</th><th>Діапазон</th><th>Доступ</th></tr>${rows}</table></div>
    ${analog.length ? `<h4>Графіки · 24 год</h4>${analog.map(d => `<div class="mini" data-mini="${esc(d.code)}"><div class="ttl">${esc(label(d))}: ${esc(show(dev, d))}</div><div class="box"></div><div class="ch-note"></div></div>`).join("")}` : ""}
    <h4>Пристрій</h4><div class="kv"><span>ID</span><span>${esc(dev.id)}</span>${info}
      <span>Оновлено в системі</span><span>${dev.seen ? fmtT(dev.seen, 1) : "—"}</span></div>
    <h4>Події (${r.events.length})</h4><ul class="list">${r.events.map(e => `<li><span class="t">${fmtT(e.ts, 1)}</span><span>${esc(e.text)}</span></li>`).join("") || `<li class="dim">немає</li>`}</ul>`;
  for (const d of analog) {
    const el = body.querySelector(`[data-mini="${CSS.escape(d.code)}"]`);
    const {series: h} = await api("/api/series", {s: `${dev.id}:${d.code}`, h: 24});
    const pts = (h[`${dev.id}:${d.code}`] || []).filter(p => typeof p[1] === "number");
    if (pts.length < 2) { el.querySelector(".ch-note").textContent = "історія накопичується"; continue; }
    const keep = range; range = 24;
    el.querySelector(".box").innerHTML = chartSvg(el.querySelector(".box"), pts, d, {thresholds: /voltage/.test(d.code) ? [S.thresholds.voltage_low, S.thresholds.voltage_high] : []});
    range = keep;
  }
}
document.addEventListener("click", e => {
  const card = e.target.closest(".dev[data-dev]"); if (card) openDevice(card.dataset.dev);
  if (e.target.matches("[data-close]") || e.target.id === "modal") document.getElementById("modal").classList.remove("on");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("modal").classList.remove("on"); });

async function renderLists() {
  const {events} = await api("/api/events", {n: 300});
  const week = S.now - 7 * 864e5;
  const sum = (kind, cur) => events.filter(e => e.kind === kind && e.end > week).reduce((a, e) => a + e.end - Math.max(e.start, week), 0)
    + (cur ? S.now - Math.max(cur, week) : 0);
  const hub = S.devices.find(d => d.gateway);
  const netDown = hub && !hub.online && S.internet && !S.internet.up ? S.internet.since : null;
  document.getElementById("out-sum").textContent =
    `За 7 днів: без світла ${dur(sum("outage_end", S.outage?.start))} · без інтернету ${dur(sum("internet_up", netDown))}`;
  const cur = [];
  // зліва — дата, справа — «з … до …» (час кінця з датою, якщо закінчилось іншого дня)
  const dd = ms => new Date(ms).toLocaleDateString("uk-UA", {day: "2-digit", month: "2-digit"});
  const till = (a, b) => dd(a) === dd(b) ? fmtT(b) : fmtT(b, 1);
  if (S.outage) cur.push(`<li><span class="t">${dd(S.outage.start)}</span><span><span class="kind power">без світла</span>з ${fmtT(S.outage.start)} · <b>зараз немає</b> · ${dur(S.now - S.outage.start)}</span></li>`);
  if (netDown) cur.push(`<li><span class="t">${dd(netDown)}</span><span><span class="kind net">без інтернету</span>з ${fmtT(netDown)} · <b>зараз немає</b> · ${dur(S.now - netDown)}</span></li>`);
  const past = events.filter(e => e.kind === "outage_end" || e.kind === "internet_up").map(e => {
    const k = e.kind === "outage_end" ? ["power", "без світла"] : ["net", "без інтернету"];
    return `<li><span class="t">${dd(e.start)}</span><span><span class="kind ${k[0]}">${k[1]}</span>з ${fmtT(e.start)} до ${till(e.start, e.end)} · ${dur(e.end - e.start)}</span></li>`;
  });
  document.getElementById("outages").innerHTML = cur.concat(past).join("") || `<li class="dim">Поки не було</li>`;
  document.getElementById("events").innerHTML = events.slice(0, 80).map(e =>
    `<li class="${["online","offline"].includes(e.kind) ? "dim" : ""}"><span class="t">${fmtT(e.ts, 1)}</span><span>${PVTEXT(esc(e.text))}</span></li>`).join("")
    || `<li class="dim">Подій ще немає</li>`;
}

function renderQuota() {
  const u = S.usage || {calls: 0}, p = S.plan;
  if (!p) return;
  const pct = Math.min(100, 100 * u.calls / p.quota);
  const note = p.log_disabled ? " Детальна історія вимкнена, щоб не перевищити ліміт."
    : p.log_factor > 1 ? ` Детальні інтервали розтягнуто ×${p.log_factor.toFixed(2)}.` : "";
  document.getElementById("quota").innerHTML = `<div>${u.calls} з ${p.quota} запитів за ${u.month || "місяць"}</div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="muted">План: ~${p.total} на місяць (бюджет ${p.budget}). Знімок раз на ${p.snapshot_every_min} хв.${note}</div>`;
}

const RANGES = [[6,"6 год"],[24,"24 год"],[168,"7 д"],[720,"30 д"]];
function renderRanges() {
  document.getElementById("ranges").innerHTML = RANGES.map(([h, t]) => `<button class="${h === range ? "on" : ""}" data-h="${h}">${t}</button>`).join("");
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-h]");
  if (b) { range = +b.dataset.h; renderRanges(); renderCharts(); }
});
let rz, lastW = innerWidth;
addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(renderCharts, 250); });

// --- вид: «Показники» (за замовчуванням) або «Датчики і прилади»; браузер пам'ятає останній
const VIEW_KEY = "tuyahome.view";
function setView(v) {
  document.getElementById("views").dataset.view = v;
  try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
  if (v === "analog" && S) { chartKeys = ""; renderCharts(); }  // приховані графіки мали нульову ширину — перемалювати
  document.getElementById("views").scrollIntoView({behavior: "smooth", block: "nearest"});
}
document.getElementById("to-discrete").onclick = () => setView("discrete");
document.getElementById("to-analog").onclick = () => setView("analog");
try { if (localStorage.getItem(VIEW_KEY) === "discrete") document.getElementById("views").dataset.view = "discrete"; } catch (e) {}

async function load() {
  try {
    S = await api("/api/state");
    document.getElementById("err").style.display = "none";
    renderHeader(); renderDevices(); renderQuota(); renderRanges();
    await Promise.all([renderSchedule(), renderWeather(), renderCharts(), renderLists(), renderVacuum()]);
    document.body.classList.remove("loading");
  } catch (e) {
    if (document.body.classList.contains("loading")) {  // перше завантаження не вдалось — пишемо на екрані завантаження
      document.getElementById("loader").classList.add("err");
      document.getElementById("loader-msg").textContent = `Не вдалося завантажити (${e.message}). Повтор за хвилину…`;
      return;
    }
    const el = document.getElementById("err"); el.style.display = "block"; el.textContent = `Не вдалося оновити: ${e.message}`;
  }
}
document.body.dataset.top = "power";
function applyDeepLink() {
  const tab = QS.get("tab"); if (!tab) return;
  const b = document.querySelector(`#toptabs [data-t="${tab}"]`); if (b) b.click();
  setTimeout(() => {
    if (tab === "history") {
      if (QS.get("hp")) { const p = document.querySelector(`#h-period [data-p="${QS.get("hp")}"]`); if (p) p.click(); }
      if (QS.get("hk")) { const k = document.querySelector(`#h-kind [data-k="${QS.get("hk")}"]`); if (k) k.click(); }
      if (QS.get("av")) setTimeout(() => { const v = document.querySelector(`#al-view [data-v="${QS.get("av")}"]`); if (v) v.click(); }, 1500);
    }
    if (tab === "game" && QS.get("game")) { const g = document.querySelector(`#g-sub [data-g="${QS.get("game")}"]`); if (g) g.click(); }
    if (tab === "weather" && QS.get("wt")) { wTab = QS.get("wt"); renderWeather(); }
  }, 600);
}
document.querySelectorAll("#toptabs button").forEach(b => b.onclick = () => {
  document.body.dataset.top = b.dataset.t;
  if (b.dataset.t === "history") initHistory();
  if (b.dataset.t === "game") initGame();
  if (b.dataset.t === "vacuum") renderVacuum();
  document.querySelectorAll("#toptabs button").forEach(x => x.classList.toggle("on", x === b));
});
// 19.11: відкриті у фоні дашборди щохвилини смикали Lambda (по кілька запитів) — разом з ботом
// вичерпували ліміт акаунта на 10 одночасних запусків, і Telegram отримував відмову. Тепер оновлюємо лише видиму сторінку.
let lastLoad = 0;
async function tick(force) {
  if (document.hidden || document.body.dataset.top === "game") return;
  if (!force && Date.now() - lastLoad < 55000) return;
  lastLoad = Date.now();
  await load();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
load().then(() => { lastLoad = Date.now(); applyDeepLink(); }); setInterval(tick, 60000);
</script>
