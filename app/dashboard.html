<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дім">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<title>Дім</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--ok:#15803d;--ok-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;--warn:#a16207;--warn-bg:#fef3c7;--accent:#2563eb;--chart:#2563eb;--grid:#eef0f3;--on:#86efac;--off:#f87171;--maybe:#fcd34d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--muted:#9aa1ad;--line:#2a2e36;--ok:#4ade80;--ok-bg:#14301f;--bad:#f87171;--bad-bg:#3a1717;--warn:#facc15;--warn-bg:#3a3110;--accent:#60a5fa;--chart:#60a5fa;--grid:#23272f;--on:#166534;--off:#991b1b;--maybe:#a16207}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1680px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.sec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.sec-head h2{margin:0;margin-right:auto}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header .title{display:flex;align-items:center;gap:12px;margin-right:auto;flex-wrap:wrap}
.status{display:flex;gap:10px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;min-width:0}
.st .ico{font-size:20px;line-height:1}
.st b{display:block;font-size:15px}
.st span{display:block;font-size:12px;opacity:.85}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.bad{background:var(--bad-bg);color:var(--bad)}.st.warn{background:var(--warn-bg);color:var(--warn)}

/* графік відключень */
#sched{margin-bottom:12px}
.sched-day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;margin-top:8px}
.sched-day .lbl{font-weight:600;font-size:13px}
.sched-day .lbl span{display:block;font-weight:400;color:var(--muted);font-size:12px}
.bar48{display:grid;grid-template-columns:repeat(48,1fr);gap:1px;height:22px;border-radius:6px;overflow:hidden;position:relative}
.bar48 i{display:block;background:var(--on)}.bar48 i.off{background:var(--off)}.bar48 i.maybe{background:var(--maybe)}
.bar48 .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.bars{display:grid;grid-template-columns:38px minmax(0,1fr);gap:3px 6px;align-items:center}
.bars .cap{font-size:11px;color:var(--muted)}
.fact{position:relative;height:14px;border-radius:6px;overflow:hidden;
  background:repeating-linear-gradient(45deg,var(--grid) 0 4px,transparent 4px 8px)}
.fact b{position:absolute;top:0;bottom:0;background:var(--on)}.fact b.off{background:var(--off)}.fact b.unk{background:var(--muted);opacity:.45}
.ticks{display:grid;grid-template-columns:repeat(8,1fr);font-size:11px;color:var(--muted);margin-left:164px;margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;background:var(--on)}
.legend i.off{background:var(--off)}.legend i.maybe{background:var(--maybe)}
.next{font-weight:600}
/* погода: прогноз vs датчик «Назовні» — та сама сітка доби, що й графік ДТЕК */
#weather{margin-bottom:12px}
.toptabs{margin:0 0 8px}.toptabs .seg button{padding:6px 16px;font-size:14px}
body[data-top="power"] #weather,body[data-top="weather"] #sched,body:not([data-top="history"]) #hist,
body[data-top="history"] #sched,body[data-top="history"] #weather{display:none}
#hist{margin-bottom:12px}
#loader{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:50}
body.loading #loader{display:flex}body.loading main{visibility:hidden}
#loader b{font-size:20px}#loader span{color:var(--muted);font-size:14px;text-align:center;padding:0 16px}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
#loader.err .spin{animation:none;border-top-color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
/* у вкладках, поки вантажиться історія, — той самий кружечок, менший */
.hload{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:14px 0}
.hload .spin{width:22px;height:22px;border-width:3px}
body[data-top="history"] #hist ~ *{display:none}
body:not([data-top="game"]) #game{display:none}
/* пилосос (22.11) — окрема вкладка, лише коли пилосос підключено */
body:not([data-top="vacuum"]) #vac{display:none}
body[data-top="vacuum"] #sched,body[data-top="vacuum"] #weather,body[data-top="vacuum"] #vac ~ *{display:none}
#vac{margin-bottom:12px}
.vgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.vgrid{grid-template-columns:1fr}}
.vmap{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:block}
.vmapbox{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vmapbox .vov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:10px;border-radius:12px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);font-weight:600}
.vmapbox.busy .vov{display:flex}.vmapbox .vov .spin{width:22px;height:22px;border-width:3px}
.vmapbox .vnomap{border:1px dashed var(--line);border-radius:12px;padding:40px 12px;text-align:center}
.vbars{display:grid;gap:7px;margin:4px 0 10px}
.vbar{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:8px;font-size:13px}
.vbar i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.vbar i b{display:block;height:100%;border-radius:4px;background:var(--good,#16a34a)}
.vbar i b.mid{background:#f59e0b}.vbar i b.low{background:var(--bad,#dc2626)}
.vbar span:last-child{text-align:right;color:var(--muted)}
.vrooms{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.vrooms span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.vhist{display:grid;gap:3px;margin:4px 0 10px;font-size:13px}.vhist div{display:grid;grid-template-columns:1.4fr .8fr .7fr 1fr;gap:6px;border-bottom:1px solid var(--line);padding:3px 0}
.vhist .bad{color:var(--bad,#dc2626)}
.vrooms span.on{border-color:var(--accent);color:var(--accent);font-weight:600}
body[data-top="game"] #sched,body[data-top="game"] #weather,body[data-top="game"] #game ~ *{display:none}
/* гра «Пляшечки» */
#game{margin-bottom:12px}
.gbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}
.gbar>div{padding:6px 10px;border:1px solid var(--line);border-radius:12px}
.gbar small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gbar b{display:block;font-size:20px}.gbar span{display:block;font-size:11px;color:var(--muted)}
.gtubes{position:relative;padding:0 0 4px}.gtubes canvas{display:block;width:100%;touch-action:manipulation;cursor:pointer}
/* пляшечка: кнопка-обгортка (корок, рух) + скло (рідина обрізається по склу) */
.tube{position:relative;width:46px;height:166px;padding:0;border:0;background:none;cursor:pointer;transition:transform .15s;flex:none}
/* корпус: «плечі» зверху й кругле дно; рідина впритул до скла (форму дає overflow:hidden) */
.tube .glass{position:absolute;left:0;right:0;bottom:0;top:32px;border:2px solid var(--muted);border-radius:15px 15px 22px 22px;padding:0;
  display:flex;flex-direction:column-reverse;overflow:hidden;
  background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.18) 30%,rgba(255,255,255,0) 60%)}
.tube .glass i{display:block;height:var(--lh,32px);flex:none;margin:0;
  background-image:linear-gradient(90deg,rgba(0,0,0,.10),rgba(255,255,255,.28) 28%,rgba(255,255,255,0) 55%,rgba(0,0,0,.12))}
.tube .glass i:last-child{box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}   /* поверхня рідини */
/* горлечко з ободком; фон картки закриває верх корпусу посередині — виходить отвір у горлечко */
.tube .neck{position:absolute;left:50%;top:5px;width:20px;margin-left:-10px;height:30px;border:2px solid var(--muted);border-top:0;border-bottom:0;
  background:var(--card);z-index:1}
.tube .neck::before{content:"";position:absolute;left:-6px;right:-6px;top:-5px;height:5px;border:2px solid var(--muted);border-radius:3px;background:var(--card)}
.tube.sel .neck,.tube.sel .neck::before{border-color:var(--accent)}
.tube .neck.flow-r{background:linear-gradient(90deg,var(--card) 58%,var(--flow) 58%)}
.tube .neck.flow-l{background:linear-gradient(90deg,var(--flow) 42%,var(--card) 42%)}
.tube .neck.flow{animation:neckFlow .5s linear infinite}
@keyframes neckFlow{from{filter:brightness(1)}50%{filter:brightness(1.12)}to{filter:brightness(1)}}
.tube.done .neck,.tube.done .neck::before{border-color:var(--ok)}
.tube.sel{transform:translateY(-14px)}
.tube.sel .glass{border-color:var(--accent);box-shadow:0 6px 14px rgba(37,99,235,.25)}
.tube.done .glass{border-color:var(--ok)}
/* корок: з'являється, коли пляшечка заповнена одним кольором */
.cork{position:absolute;left:50%;top:-6px;width:22px;height:20px;margin-left:-11px;border-radius:5px 5px 3px 3px;z-index:2;
  background:linear-gradient(180deg,#c8946a,#9a6a43 70%,#7b5233);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.25)}
.cork.new{animation:corkIn .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes corkIn{0%{transform:translateY(-34px) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
/* струмінь під час переливання */
.stream{position:absolute;width:6px;border-radius:3px;z-index:4;pointer-events:none;
  background-image:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
@media (prefers-reduced-motion:reduce){.cork.new{animation:none}}
.gctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.gctl button,.gwin button{font:inherit;font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.gctl button:disabled{opacity:.45;cursor:default}
.gwin{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.gwin button{background:var(--ok);color:#fff;border-color:transparent}
.gtop-h{font-size:13px;margin:14px 0 6px}
.privacy .pv{filter:blur(6px);user-select:none}
.gtop{margin:0;padding:0;list-style:none}
.gtop li{display:flex;gap:6px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.gtop li span:last-child{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.gtop li.me{font-weight:700;color:var(--accent)}
.gsub{margin:0 0 10px}.gsub .seg button{padding:6px 14px;font-size:14px}
.gnext{margin:0 0 8px}
.gboss{background:linear-gradient(90deg,#3b0764,#7c2d12);color:#fde68a;border-radius:12px;padding:9px 12px;font-weight:700;margin:0 0 10px;
  animation:bossGlow 2.4s ease-in-out infinite alternate}
@keyframes bossGlow{from{box-shadow:0 0 0 rgba(251,191,36,0)}to{box-shadow:0 0 18px rgba(251,191,36,.45)}}
.gtubes.boss{background:radial-gradient(ellipse at center,rgba(124,58,237,.16),transparent 70%);border-radius:16px}
.tube .glass i.hid{background:repeating-linear-gradient(45deg,#6b7280 0 6px,#4b5563 6px 12px);position:relative}
.tube .glass i.hid::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#e5e7eb;font-weight:800;font-size:15px}
/* ⛀ шашки */
.cs-ctl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.cs-msg{font-weight:700;padding:6px 10px;border-radius:10px;margin:0 0 6px;background:var(--grid)}
.cs-msg.check{background:var(--warn-bg);color:var(--warn)}.cs-msg.win{background:var(--ok-bg);color:var(--ok)}
.cs-msg.loss{background:var(--bad-bg);color:var(--bad)}.cs-msg.draw{background:var(--grid)}
.cs-board{position:relative;width:min(100%,440px);aspect-ratio:1;margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border-radius:8px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.18);user-select:none;border:6px solid #5b3a1e}
.csq{position:relative;cursor:pointer}.csq.lt{background:#f0d9b5}.csq.dk{background:#8b5a2b}
.csq.lastm.dk{background:#a87a3c}
.csq.seld{box-shadow:inset 0 0 0 4px rgba(250,204,21,.9)}
.csq.must{box-shadow:inset 0 0 0 3px rgba(239,68,68,.85);animation:chkPulse .9s ease-in-out infinite alternate}
@keyframes chkPulse{from{filter:brightness(1)}to{filter:brightness(1.3)}}
.csq.dot::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(250,204,21,.65)}
.csq em{position:absolute;font-style:normal;font-size:10px;font-weight:700;opacity:.6;pointer-events:none}
.csq em.rk{left:3px;top:2px}.csq em.fl{right:4px;bottom:1px}
.csq.lt em{color:#8b5a2b}.csq.dk em{color:#f0d9b5}
.cs-pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;
  pointer-events:none;transition:transform .28s cubic-bezier(.3,.1,.3,1)}
.pc i{width:78%;height:78%;border-radius:50%;position:relative;transition:transform .13s}
.pc.w i{background:radial-gradient(circle at 35% 30%,#fff,#e7e2d6 55%,#b9b2a2);box-shadow:0 3px 0 #9c9484,0 4px 6px rgba(0,0,0,.35)}
.pc.b i{background:radial-gradient(circle at 35% 30%,#6b6b6b,#2b2b2b 55%,#111);box-shadow:0 3px 0 #000,0 4px 6px rgba(0,0,0,.45)}
.pc i::before{content:"";position:absolute;inset:16%;border-radius:50%;border:2px solid rgba(0,0,0,.14)}
.pc.b i::before{border-color:rgba(255,255,255,.12)}
.pc.king i::after{content:"👑";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(4.5vw,22px)}
.pc.moving{z-index:3}
.pc.hop i{transform:scale(1.18) translateY(-6%)}
.pc.taken{opacity:0;scale:.3;transition:opacity .25s,scale .25s}
.pc.promoted i{animation:promo .6s ease-out}
@keyframes promo{0%{transform:scale(.6);filter:brightness(2.2)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.cs-caps{font-size:13px;color:var(--muted);margin:4px auto;width:min(100%,440px)}
@media (prefers-reduced-motion:reduce){.pc{transition:none}.gboss,.csq.chk{animation:none}}  /* в історії — лише історія, без показників, подій і квоти */
.hctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.hctl input,.hctl select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.hsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0 0 10px}
.hsum>div{padding:8px 12px;border:1px solid var(--line);border-radius:12px}
.hsum small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hsum b{display:block;font-size:18px}.hsum span{display:block;font-size:12px;color:var(--muted)}
.hchart{position:relative;height:160px;border-radius:6px;background:var(--grid);overflow:hidden}
.hchart.small-h{height:40px;margin-top:4px}
.hchart svg{position:absolute;inset:0;width:100%;height:100%}
.hchart .rng{position:absolute;left:4px;top:2px;font-size:10px;color:var(--muted)}.hchart .rng.b{top:auto;bottom:2px}
.abar{height:18px}.abar b.calm{background:var(--ok-bg)}.abar b.red{background:var(--bad)}.abar b.yel{background:var(--maybe)}
.abar span{position:absolute;left:6px;top:1px;font-size:10px;color:var(--ink);opacity:.75;pointer-events:none;text-shadow:0 0 3px var(--card)}
.rank{display:flex;flex-direction:column;gap:2px}
#hist.rankview .hctl{display:none}
.rrow{display:grid;grid-template-columns:30px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow.now{background:var(--bad-bg)}
.rpos{font-size:16px;text-align:center;color:var(--muted)}
.rrow:nth-child(1) .rpos{color:#d4a017}.rrow:nth-child(2) .rpos{color:#9ca3af}.rrow:nth-child(3) .rpos{color:#b45309}
.rname{font-weight:600}.rname span{display:block;font-weight:400;font-size:12px;color:var(--muted)}.rname em{font-style:normal;color:var(--bad)}
.rbar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}.rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--maybe),var(--bad))}
.rnum b{display:block}.rnum span{font-size:12px;color:var(--muted)}
@media (max-width:600px){.rrow{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr)}.rbar{display:none}}
.haxis{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:2px}
.haxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.sky{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;height:30px;border-radius:6px;overflow:hidden;position:relative}
.sky i{display:flex;align-items:center;justify-content:center;gap:3px;font-style:normal;font-size:12px;background:var(--grid)}
.sky i.clear{background:#fef3c7}.sky i.cloud{background:#e5e7eb}.sky i.rain{background:#bfdbfe}.sky i.snow{background:#e0f2fe}.sky i.storm{background:#c7d2fe}
@media (prefers-color-scheme:dark){.sky i.clear{background:#3a3110}.sky i.cloud{background:#2a2e36}.sky i.rain{background:#1e3a5f}.sky i.snow{background:#1f3b4d}.sky i.storm{background:#312e81}}
.wline{position:relative;height:46px;border-radius:6px;background:var(--grid);overflow:hidden}
.wline svg{position:absolute;inset:0;width:100%;height:100%}
.wline .rng{position:absolute;left:4px;top:1px;font-size:10px;color:var(--muted)}
.wline .rng.b{top:auto;bottom:1px}
.sky .now,.wline .now{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.wtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:2px 0 6px}
.wt{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;min-width:0}
.wt .wi{font-size:24px;line-height:1}
.wt small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.wt b{display:block;font-size:18px;line-height:1.25}
.wt b em{font-style:normal;font-weight:500;font-size:14px;color:var(--muted);margin-left:6px}
.wt span:last-child{display:block;font-size:12px;color:var(--muted)}
.wt.wet{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:transparent}.wt.wet b{color:var(--accent)}
.wt.dim{opacity:.6}
.rain{position:relative;height:40px;border-radius:6px;background:var(--grid);overflow:hidden}
.rain b{position:absolute;bottom:4px;border-radius:2px 2px 0 0}
.rain u{position:absolute;bottom:0;height:2px;background:#ea580c;opacity:.7;text-decoration:none}

<body class="loading">
<!-- екран завантаження: поки не прийшли перші дані, порожній дашборд не показуємо -->

  <!-- над графіками: перемикач «Світло» (графік ДТЕК + факт) / «Погода» (прогноз + датчик); за замовчуванням — світло -->

  <!-- два види: «Показники» (аналогові, за замовчуванням) і «Датчики і прилади» (дискретні);
       перемикач — вертикальна стрілка на всю висоту: справа на показниках, зліва на датчиках -->
  <div class="views" id="views" data-view="analog">

</main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const K = new URLSearchParams(location.search).get("k") || "";
const QS = new URLSearchParams(location.search);
// ?privacy=1 — для знімків екрана: адреса, місто, район, черга, імена — розмиті (клас pv)
if (QS.get("privacy") === "1") document.documentElement.classList.add("privacy");
const PV = s => `<span class="pv">${s}</span>`;
// у текстах подій: назви регіонів і міст («… район», «… область», «м. …», «… громада», черга) — розмити
const PVTEXT = s => !document.documentElement.classList.contains("privacy") ? s :
  s.replace(/(м\. [А-ЯІЇЄҐ][^\s,.)]+|[А-ЯІЇЄҐ][а-яіїєґ'’-]+(?:ий|а|е)? (?:район|область|громада)|черга [\d.]+)/g, m => PV(m));
const api = (p, q = {}) => fetch(`${p}?${new URLSearchParams({k: K, ...q})}`).then(r => {
  if (!r.ok) throw new Error(r.status);
  if (p === "/api/state") offlineBanner(+r.headers.get("x-cached-at") || null);  // заголовок є лише в копії з кешу (мережі немає)
  return r.json(); });

// PWA (21.11): маніфест з ключем цієї людини (start_url), service worker — робота без мережі з останніми даними
if (K) {
  const m = document.createElement("link");
  m.rel = "manifest"; m.href = `/manifest.webmanifest?k=${encodeURIComponent(K)}`;
  document.head.appendChild(m);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", {scope: "/"}).catch(() => {});
}
function offlineBanner(ts) {
  let b = document.getElementById("offline");
  if (!ts) { if (b) b.remove(); return; }
  if (!b) {
    b = document.createElement("div");
    b.id = "offline";
    b.style.cssText = "position:sticky;top:0;z-index:50;background:var(--warn-bg);color:var(--warn);padding:8px 14px;border-radius:10px;margin:0 0 10px;font-size:14px";
    document.body.prepend(b);
  }
  b.textContent = `📴 Немає зв'язку — показано останні дані на ${new Date(ts).toLocaleString("uk-UA", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`;
}
addEventListener("online", () => offlineBanner(null));

const LABEL = {cur_voltage:"Напруга",cur_power:"Потужність",cur_current:"Струм",add_ele:"Спожито",
  switch:"Стан",switch_on:"Увімкнено",switch_1:"Канал 1",switch_2:"Канал 2",switch_3:"Канал 3",switch_4:"Канал 4",switch_5:"Канал 5",switch_6:"Канал 6",
  va_temperature:"Температура",temp_current:"Температура",prm_temperature:"Температура",
  va_humidity:"Вологість",humidity_value:"Вологість",prm_content:"Вологість",
  battery_percentage:"Батарея",battery:"Батарея",Battery:"Батарея",va_battery:"Батарея",
  watersensor_state:"Протікання",gas_sensor_status:"Газ",gas_sensor_state:"Газ",gas_sensor_value:"Газ, рівень",
  smoke_sensor_status:"Дим",smoke_sensor_state:"Дим",master_state:"Стан хаба",pir:"Рух",pir_state:"Рух",
  illuminance_value:"Освітленість",doorcontact_state:"Двері",prm_switch:"Двері",switch_mode1:"Натискання",switch_type_1:"Натискання",
  checking_result:"Самоперевірка",preheat:"Прогрів"};
const UNIT = {"度":"кВт·год","V":"В","W":"Вт","mA":"мА","s":"с","%":"%","℃":"°C","LEL":"LEL","lux":"лк"};
const VAL = {normal:"норма",alarm:"ТРИВОГА",check_success:"ок",check_failure:"збій",single_click:"одне",click:"одне",
  double_click:"подвійне",long_press:"довге",pir:"є рух",none:"немає"};
const PRIMARY = /voltage|power|current|ele|temp|humid|battery|state|status|switch|pir|illum|door|gas_sensor_value|prm_/i;
const SETTINGS = /sensitivity|delay|sampl|compens|ringtone|alarm_time|alarm_switch|alarm_volume|muffl|reset|convert|alarm_active|sound|self_check/i;
const BATTERY = /battery/i;
// ці показники на графіках не потрібні (2026-11-15)
const CHART_EXCLUDE = /gas_sensor_value|add_ele|cur_current|cur_power/;
const ICON = {cz:"🔌", rqbj:"🔥", ywbj:"💨", sj:"💧", mcs:"🚪", wsdcg:"🌡️", pir:"🏃", wxkg:"🔘", wg2:"📡", wg:"📡", kg:"📺"};

let S = null, range = 24;
const fmtT = (ms, d) => new Date(ms).toLocaleString("uk-UA", d ? {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"} : {hour:"2-digit",minute:"2-digit"});
const hhmm = ms => { const s = fmtT(ms); return s === "00:00" ? "24:00" : s; };
const dur = ms => { let m = Math.max(0, Math.round(ms/60000)), d = Math.floor(m/1440), h = Math.floor(m%1440/60); m %= 60;
  return [d && d+" д", h && h+" год", m+" хв"].filter(Boolean).join(" "); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label = d => LABEL[d.code] || d.code;
const unit = u => UNIT[u] ?? u ?? "";
const isPrimary = d => PRIMARY.test(d.code) && !SETTINGS.test(d.code);
const isAnalog = d => typeof d.value === "number" && isPrimary(d) && !BATTERY.test(d.code) && !CHART_EXCLUDE.test(d.code);
const isDiscrete = d => typeof d.value !== "number" && isPrimary(d);
function show(dev, d) {
  const v = d.value;
  if (typeof v === "boolean") {
    if (dev.category === "mcs" || /door|prm_switch/.test(d.code)) return v ? "відчинено" : "зачинено";
    return v ? "увімк" : "вимк";
  }
  if (typeof v === "number") return `${v} ${unit(d.unit)}`.trim();
  return VAL[v] ?? (v === "" ? "—" : v);
}
function setSt(id, cls, title, sub) {
  const el = document.getElementById(id);
  el.className = `st ${cls}`; el.querySelector("b").textContent = title; el.querySelector("span:last-child").textContent = sub;
}

function renderHeader() {
  const hub = S.devices.find(d => d.gateway);
  const netUp = !hub || hub.online, net = S.internet || {};
  if (netUp) setSt("st-net", "ok", "Інтернет є", net.since ? `з ${fmtT(net.since, 1)}` : "");
  else setSt("st-net", "bad", "Немає інтернету", `${dur(S.now - (net.since || hub.offline_since || S.now))} · хаб офлайн`);
  if (S.outage) setSt("st-power", "bad", "Немає світла", `${dur(S.now - S.outage.start)} · з ${fmtT(S.outage.start)}`);
  else if (!netUp) setSt("st-power", "warn", "Світло: невідомо", "розетка працює через хаб");
  else { const since = S.power?.since || S.last_outage?.end; setSt("st-power", "ok", "Світло є", since ? `з ${fmtT(since, 1)}` : ""); }
  const lp = S.last_poll?.ts;
  document.getElementById("updated").textContent = lp ? `оновлено ${fmtT(lp)}` : "";
  renderAlerts();
}

function renderAlerts() {
  const A = S.air_alerts || {};
  document.getElementById("st-alerts").innerHTML = Object.entries(A).map(([name, a]) => {
    const short = name.replace(/ район$/, " р-н");
    const yel = a.level === "yellow";
    return a.active
      ? `<div class="st ${yel ? "warn" : "bad"}"><span class="ico">${yel ? "🟡" : "🚨"}</span><div><b>${yel ? "Жовта тривога" : "Тривога"} · ${PV(esc(short))}</b><span>${yel ? "жовтий" : "червоний"} рівень · ${dur(S.now - a.since)} · з ${fmtT(a.since)}</span></div></div>`
      : `<div class="st ok"><span class="ico">🕊️</span><div><b>Тихо · ${PV(esc(short))}</b><span>${a.last ? `відбій о ${fmtT(a.last.end)}` : "без тривоги"}</span></div></div>`;
  }).join("");
}

// смуга «Факт»: зелене — світло було (розетка онлайн), червоне — не було, сіре — невідомо (не було інтернету),
// штрихи — немає даних (до запуску системи або ще не настало)
function factBar(day, A) {
  const d0 = day, d1 = day + 864e5, pct = t => (Math.min(Math.max(t, d0), d1) - d0) / 864e5 * 100;
  const from = Math.max(d0, A.monitor_since || A.now), to = Math.min(d1, A.now);
  if (to <= from) return `<div class="fact"></div>`;
  const seg = (a, b, cls) => { a = Math.max(a, from); b = Math.min(b, to); return b > a ? `<b class="${cls}" style="left:${pct(a)}%;width:${pct(b) - pct(a)}%"></b>` : ""; };
  return `<div class="fact">${seg(from, to, "")}${A.off.map(([a, b]) => seg(a, b, "off")).join("")}${A.unknown.map(([a, b]) => seg(a, b, "unk")).join("")}</div>`;
}

// ---- погода: прогноз Open-Meteo по годинах (пунктир) і датчик «Назовні» (суцільна лінія)
const WMO = [[0,"☀️","ясно","clear"],[1,"🌤","переважно ясно","clear"],[2,"⛅","мінлива хмарність","cloud"],[3,"☁️","хмарно","cloud"],
  [45,"🌫","туман","cloud"],[48,"🌫","туман","cloud"],[51,"🌦","мряка","rain"],[53,"🌦","мряка","rain"],[55,"🌧","мряка","rain"],
  [56,"🌧","крижана мряка","rain"],[57,"🌧","крижана мряка","rain"],[61,"🌦","невеликий дощ","rain"],[63,"🌧","дощ","rain"],
  [65,"🌧","сильний дощ","rain"],[66,"🌧","крижаний дощ","rain"],[67,"🌧","крижаний дощ","rain"],[71,"🌨","невеликий сніг","snow"],
  [73,"🌨","сніг","snow"],[75,"❄️","сильний сніг","snow"],[77,"🌨","крупа","snow"],[80,"🌦","злива","rain"],[81,"🌧","зливи","rain"],
  [82,"⛈","сильні зливи","storm"],[85,"🌨","снігопад","snow"],[86,"❄️","снігопад","snow"],[95,"⛈","гроза","storm"],[96,"⛈","гроза з градом","storm"],[99,"⛈","гроза з градом","storm"]];
const wmo = c => WMO.find(w => w[0] === c) || [c, "🌡", "—", ""];

function wLine(d0, d1, fc, sens, lo, hi, fmt) {
  // fc, sens — [[мс, значення]]; x — частка доби, y — у межах lo..hi
  const X = t => ((t - d0) / (d1 - d0) * 1000).toFixed(1), Y = v => (44 - (v - lo) / (hi - lo || 1) * 40).toFixed(1);
  const path = pts => pts.filter(p => p[1] != null).map((p, i) => `${i ? "L" : "M"}${X(p[0])},${Y(p[1])}`).join("");
  // датчик міряє цілими (5°, 6°) — сирі точки дають «сходинки»; згладжуємо ковзним середнім ±1 год і малюємо кривою
  const smooth = pts => pts.map(([t]) => { const w = pts.filter(q => Math.abs(q[0] - t) <= 36e5);
    return [t, w.reduce((a, q) => a + q[1], 0) / w.length]; });
  const curve = pts => { if (pts.length < 3) return path(pts);
    const P = pts.map(p => [+X(p[0]), +Y(p[1])]); let d = `M${P[0][0]},${P[0][1]}`;
    for (let i = 0; i < P.length - 1; i++) { const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0]},${p2[1]}`; }
    return d; };
  const s = smooth(sens.filter(p => p[0] >= d0 && p[0] < d1 && p[1] != null));
  const nowPos = S.now >= d0 && S.now < d1 ? `<span class="now" style="left:${(S.now - d0) / (d1 - d0) * 100}%"></span>` : "";
  return `<div class="wline"><svg viewBox="0 0 1000 46" preserveAspectRatio="none">
    <path d="${path(fc)}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
    ${s.length ? `<path d="${curve(s)}" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity=".9" vector-effect="non-scaling-stroke"/>` : ""}</svg>
    <span class="rng">${fmt(hi)}</span><span class="rng b">${fmt(lo)}</span>${nowPos}</div>`;
}

// опади по годинах — стовпчики (висота = мм/год, колір = сила); помаранчева смуга знизу — датчик «вологість ≥ 93%» (повітря насичене)
function rainBars(d0, d1, hours, F, hum) {
  const mm = hours.map(h => h[F.precipitation] || 0), top = Math.max(2, ...mm);
  const col = v => v < .5 ? "#93c5fd" : v < 2.5 ? "#3b82f6" : v < 7.6 ? "#1d4ed8" : "#7c3aed";
  const W = (d1 - d0), x = t => (t - d0) / W * 100;
  // погодинне значення Open-Meteo — опади за попередню годину, тож стовпчик стоїть на [t−1 год, t)
  const bars = hours.map(h => { const v = h[F.precipitation] || 0; if (!v) return "";
    const pp = h[F.precipitation_probability];
    return `<b style="left:${x(h[0] - 36e5)}%;width:${100 / 24}%;height:${Math.max(6, v / top * 100)}%;background:${col(v)}" title="${fmtT(h[0] - 36e5)}–${hhmm(h[0])}: ${v} мм${pp != null ? `, імовірність ${pp}%` : ""}"></b>`; }).join("");
  let wet = "";
  for (let i = 0; i < (hum || []).length; i++) {
    const [t, v] = hum[i], t2 = i + 1 < hum.length ? hum[i + 1][0] : Math.min(S.now, t + 36e5);
    if (v >= 93 && t2 > d0 && t < d1) wet += `<u style="left:${x(Math.max(t, d0))}%;width:${x(Math.min(t2, d1)) - x(Math.max(t, d0))}%" title="датчик ${v}%"></u>`;
  }
  const nowPos = S.now >= d0 && S.now < d1 ? `<span class="now" style="left:${x(S.now)}%"></span>` : "";
  return `<div class="rain">${bars}${wet}<span class="rng">${mm.some(v => v) ? `${+top.toFixed(1)} мм/год` : "без опадів"}</span>${nowPos}</div>`;
}

const VAC_ST = {installed:"на місці",not_installed:"не встановлено",no_water:"немає води",low_water:"мало води",
  full:"повний",normal:"норма",filled:"заповнено",dirty_water_full:"повний",not_full:"не повний",check:"перевірте",
  replace:"замініть",no_dust_bag:"немає мішка",dust_bag_full:"мішок повний",unknown:"—"};

  el.innerHTML = `<div class="sec-head"><h2>🤖 ${esc(V.name || "Пилосос")}</h2><span class="small muted">${V.updated ? `оновлено о ${fmtT(V.updated)}` : ""}</span></div>
    <div class="wtiles">

      ${a ? tile("▶️", "Зараз прибирає", esc(a.rooms_text || ""), `${a.times}× · ${V.room_now ? `кімната: ${esc(V.room_now)} · ` : ""}${V.area != null ? `${V.area} м² за ${V.minutes || 0} хв` : ""}${a.by ? ` · запустив ${esc(a.by)}` : ""}`)
          : last ? tile("✅", "Останнє прибирання", esc(last.rooms_text || ""), `${fmtT(last.finished, 1)}${last.area ? ` · ${last.area} м²` : ""}${last.minutes ? ` за ${last.minutes} хв` : ""}${last.by ? ` · ${esc(last.by)}` : ""}`) : ""}
      ${V.error ? tile("⚠️", "Помилка", esc(String(V.error).replace(/_/g, " ")), "") : ""}
    </div>
    <div class="vgrid">
      <div><div class="vmapbox${vacMapBusy ? " busy" : ""}" id="vmapbox" title="Натисніть, щоб оновити карту">
          ${V.map_ts ? `<img class="vmap" alt="Карта" src="/api/vacuum/map?${new URLSearchParams({k: K, t: V.map_ts})}">`

        <div class="small muted" id="vmapcap">${V.map_ts ? `Карта на ${fmtT(V.map_ts, 1)} · натисніть на карту, щоб оновити` : ""}</div></div>
      <div>
        <h3 class="small muted">Кімнати</h3><div class="vrooms">${(V.rooms || []).map(r => `<span class="${act.has(r.id) ? "on" : ""}">${esc(r.name)}</span>`).join("")}</div>

        ${Object.keys(st).length ? `<h3 class="small muted">База</h3><div class="small">${[["dust_bag","Мішок для пилу"],["clean_water_tank","Чиста вода"],["dirty_water_tank","Брудна вода"]]

        ${(V.history || []).length ? `<h3 class="small muted">Історія прибирань (з хмари Dreame)</h3><div class="vhist">${V.history.slice(0, 12).map(h =>
          `<div><span>${h.ts ? fmtT(h.ts, 1) : "—"}</span><span>${h.area != null ? `${h.area} м²` : ""}</span><span>${h.minutes != null ? `${h.minutes} хв` : ""}</span>

// натиснули на карту — Lambda пилососа малює свіжу (~15 с); чекаємо нову map_ts і підміняємо картинку
let vacMapBusy = false;
async function refreshVacMap() {
  if (vacMapBusy) return;
  vacMapBusy = true;
  const box = () => document.getElementById("vmapbox"); box() && box().classList.add("busy");
  const cap = document.getElementById("vmapcap"), old = (await api("/api/vacuum").catch(() => ({}))).map_ts || 0;
  try {
    const r = await fetch(`/api/vacuum/map/refresh?${new URLSearchParams({k: K})}`, {method: "POST"}).then(x => x.json()).catch(() => ({}));
    if (!r.started && cap) cap.textContent = "Карту щойно оновлювали — чекаю на неї…";
    for (let i = 0; i < 25; i++) {
      await new Promise(res => setTimeout(res, 3000));
      const V = await api("/api/vacuum").catch(() => null);
      if (V && V.map_ts && V.map_ts > old) break;
    }
  } finally {
    vacMapBusy = false;
    await renderVacuum();
  }
}

let wTab = "today";
async function renderWeather() {
  const el = document.getElementById("weather");
  const R = await api("/api/weather").catch(() => null), W = R && R.weather;
  if (!W || !W.days.length) { el.hidden = true; return; }
  el.hidden = false;
  const F = Object.fromEntries(W.fields.map((f, i) => [f, i])), sn = W.sensor || {}, cur = W.current || {};
  const sT = sn.temp_series || [], sH = sn.hum_series || [];
  const deg = v => `${Math.round(v)}°`, pct = v => `${Math.round(v)}%`;
  const dayRow = (d, withSensor) => {
    const H = d.hours, temps = H.map(h => h[F.temperature_2m]);
    const tT = withSensor ? sT : [], tH = withSensor ? sH : [];
    const all = temps.concat(tT.map(p => p[1])), lo = Math.floor(Math.min(...all)) - 1, hi = Math.ceil(Math.max(...all)) + 1;
    const pp = Math.max(...H.map(h => h[F.precipitation_probability] || 0)), mm = H.reduce((a, h) => a + (h[F.precipitation] || 0), 0);
    const sky = [0,3,6,9,12,15,18,21].map(i => { const h = H[i + 1] || H[i]; if (!h) return `<i></i>`;
      const w = wmo(h[F.weather_code]); return `<i class="${w[3]}" title="${esc(w[2])}">${w[1]} ${Math.round(h[F.temperature_2m])}°</i>`; }).join("");
    const nowPos = S.now >= d.day && S.now < d.end ? `<span class="now" style="left:${(S.now - d.day) / (d.end - d.day) * 100}%"></span>` : "";
    return `<div class="sched-day"><div class="lbl">${esc(d.label)}<span>${Math.round(Math.min(...temps))}…${Math.round(Math.max(...temps))}°${pp ? ` · опади ${pp}%${mm ? `, ${mm.toFixed(1)} мм` : ""}` : ""}</span></div>
      <div class="bars"><span class="cap">Небо</span><div class="sky">${sky}${nowPos}</div>
      <span class="cap">Опади</span>${rainBars(d.day, d.end, H, F, tH)}
      <span class="cap">Темп.</span>${wLine(d.day, d.end, H.map(h => [h[0], h[F.temperature_2m]]), tT, lo, hi, deg)}
      <span class="cap">Волог.</span>${wLine(d.day, d.end, H.map(h => [h[0], h[F.relative_humidity_2m]]), tH, 0, 100, pct)}</div></div>`;
  };
  const ticks = `<div class="ticks">${[0,3,6,9,12,15,18,21].map(h => `<span class="${h % 6 ? "x" : ""}">${String(h).padStart(2,"0")}:00</span>`).join("")}</div>`;
  const legendRain = `<span><i style="background:#93c5fd"></i>&lt;0.5</span><span><i style="background:#3b82f6"></i>слабкий &lt;2.5</span>
      <span><i style="background:#1d4ed8"></i>помірний &lt;7.6</span><span><i style="background:#7c3aed"></i>сильний, мм/год</span>`;
  let body = "";
  if (wTab === "today") {
    const w = wmo(cur.code), rn = W.rain || {};
    const diff = sn.temp != null && cur.temp != null ? ` · різниця ${(sn.temp - cur.temp > 0 ? "+" : "")}${(sn.temp - cur.temp).toFixed(1)}°` : "";
    // плитки «зараз»: опади · датчик · прогноз · різниця
    const rIco = rn.rain ? (/сніг/.test(rn.text) ? "🌨" : "🌧") : (rn.hum >= 97 ? "🌫" : "☂️");
    const rTitle = rn.rain ? `${/сніг/.test(rn.text) ? "Сніг" : "Дощ"}, ${rn.level}` : rn.hum >= 97 ? "Можлива мряка" : "Опадів немає";
    const rSub = rn.rain ? (rn.mmh ? `~${rn.mmh} мм/год` : "за прогнозом") + (rn.hum != null ? (rn.confirmed ? " · датчик підтверджує" : " · датчик сумнівається") : "")
      : rn.hum >= 97 ? "за прогнозом сухо, але повітря насичене" : "за прогнозом Open-Meteo";
    const sgn = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1).replace(/\.0$/, "");
    const tile = (cls, ico, cap, big, sub) => `<div class="wt ${cls}"><span class="wi">${ico}</span><div><small>${cap}</small><b>${big}</b><span>${sub}</span></div></div>`;
    body = `<div class="wtiles">
      ${tile(rn.rain ? "wet" : "", rIco, "Зараз", esc(rTitle), esc(rSub))}
      ${sn.temp != null ? tile(sn.online ? "" : "dim", "🌡", `Датчик «${esc(sn.name)}»`, `${sn.temp}° <em>💧 ${sn.hum ?? "—"}%</em>`,
          sn.online ? (sn.ts ? `виміряно о ${fmtT(sn.ts)}` : "") : "офлайн — останнє значення") : ""}
      ${cur.temp != null ? tile("", w[1], "Прогноз", `${+cur.temp.toFixed(1)}° <em>💧 ${cur.hum}%</em>`,
          `${esc(w[2])} · відчувається ${Math.round(cur.feels)}° · вітер ${Math.round(cur.wind)} м/с`) : ""}
      ${sn.temp != null && cur.temp != null ? tile("", "↔️", "Датчик − прогноз", `${sgn(sn.temp - cur.temp)}° <em>${sgn((sn.hum ?? 0) - (cur.hum ?? 0))}%</em>`, "температура · вологість") : ""}
    </div>
      ${dayRow(W.days[0], true)}${ticks}
      <div class="legend"><span><i style="background:none;border-top:2px dashed var(--chart);height:0;border-radius:0"></i>прогноз</span>
        <span><i style="background:none;border-top:2px solid #ea580c;height:0;border-radius:0"></i>датчик «${esc(sn.name || "Назовні")}»</span>
        <span><i style="background:#ea580c;opacity:.7;height:2px"></i>датчик ≥ 93% — повітря насичене (дощ/туман)</span>${legendRain}</div>`;
  } else if (wTab === "tomorrow") {
    body = W.days[1] ? `${dayRow(W.days[1], false)}${ticks}<div class="legend">
        <span><i style="background:none;border-top:2px dashed var(--chart);height:0;border-radius:0"></i>прогноз</span>${legendRain}</div>`
      : `<div class="muted">Прогнозу на завтра ще немає</div>`;
  } else {
    const D = Object.fromEntries(W.daily_fields.map((f, i) => [f, i])), wk = W.week || [];
    const lo = Math.min(...wk.map(r => r[D.temperature_2m_min])), hi = Math.max(...wk.map(r => r[D.temperature_2m_max]));
    const top = Math.max(2, ...wk.map(r => r[D.precipitation_sum] || 0));
    body = `<div class="week">${wk.map(r => { const w = wmo(r[D.weather_code]), mn = r[D.temperature_2m_min], mx = r[D.temperature_2m_max];
      const p = r[D.precipitation_sum] || 0, pp = r[D.precipitation_probability_max] || 0;
      const name = new Date(r[0]).toLocaleDateString("uk-UA", {weekday: "short", day: "2-digit", month: "2-digit"});
      return `<div class="wday"><b>${esc(name)}</b><span class="ico" title="${esc(w[2])}">${w[1]}</span><span class="small">${esc(w[2])}</span>
        <div class="trng"><i style="left:${(mn - lo) / (hi - lo || 1) * 100}%;right:${(hi - mx) / (hi - lo || 1) * 100}%"></i></div>
        <span>${Math.round(mn)}…${Math.round(mx)}°</span>
        <div class="pbar"><i style="height:${p ? Math.max(6, p / top * 100) : 0}%"></i></div>
        <span class="small muted">${p ? `${p.toFixed(1)} мм · ${pp}%` : pp ? `опади ${pp}%` : "без опадів"}</span>
        <span class="small muted">вітер до ${Math.round(r[D.wind_speed_10m_max])} м/с</span></div>`; }).join("")}</div>`;
  }
  el.innerHTML = `<div class="sec-head"><h2>Погода · ${PV(esc(W.place || ""))}</h2>
      <span class="seg" id="wtabs">${[["today","Сьогодні"],["tomorrow","Завтра"],["week","Тиждень"]].map(([k, t]) =>
        `<button data-w="${k}" class="${k === wTab ? "on" : ""}">${t}</button>`).join("")}</span>
      <span class="small muted">прогноз Open-Meteo · оновлено ${W.fetched ? fmtT(W.fetched) : "—"}</span></div>${body}`;
  el.querySelectorAll("#wtabs button").forEach(b => b.onclick = () => { wTab = b.dataset.w; renderWeather(); });
}

// ---- вкладка «Історія»: період (день / місяць / рік / свій) × що показувати (світло / погода)
const HIST = {period: "day", kind: "power", data: null, key: ""};
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hfmt = h => { const m = Math.round(h * 60); return m >= 60 ? `${Math.floor(m / 60)} год${m % 60 ? ` ${m % 60} хв` : ""}` : `${m} хв`; };

function histRange() {
  const q = id => document.getElementById(id).value;
  const t = new Date();
  if (HIST.period === "day") { const d = q("h-day") || iso(t); return [d, d]; }
  if (HIST.period === "month") {
    const [y, m] = (q("h-month") || iso(t).slice(0, 7)).split("-").map(Number);
    return [`${y}-${String(m).padStart(2, "0")}-01`, iso(new Date(y, m, 0))];
  }
  if (HIST.period === "year") { const y = q("h-year") || t.getFullYear(); return [`${y}-01-01`, `${y}-12-31`]; }
  return [q("h-from") || iso(t), q("h-to") || iso(t)];
}

function histControls() {
  const t = new Date(), y0 = 2026;
  const years = Array.from({length: t.getFullYear() - y0 + 1}, (_, i) => t.getFullYear() - i);
  const inputs = {
    day: `<input type="date" id="h-day" value="${iso(t)}" max="${iso(t)}">`,
    month: `<input type="month" id="h-month" value="${iso(t).slice(0, 7)}" max="${iso(t).slice(0, 7)}">`,
    year: `<select id="h-year">${years.map(y => `<option>${y}</option>`).join("")}</select>`,
    custom: `<input type="date" id="h-from" value="${iso(new Date(t - 6 * 864e5))}" max="${iso(t)}"> — <input type="date" id="h-to" value="${iso(t)}" max="${iso(t)}">`,
  };
  return `<div class="sec-head"><h2>Історія</h2><span id="h-extra"></span>
    <span class="seg" id="h-kind">${[["power", "💡 Світло"], ["weather", "🌤 Погода"], ["alerts", "🚨 Тривоги"],
      ...(document.getElementById("vac-tab").hidden ? [] : [["vacuum", "🤖 Пилосос"]])].map(([k, l]) => `<button data-k="${k}" class="${k === HIST.kind ? "on" : ""}">${l}</button>`).join("")}</span></div>
    <div class="hctl"><span class="seg" id="h-period">${[["day", "День"], ["month", "Місяць"], ["year", "Рік"], ["custom", "Свій"]].map(([k, l]) =>
      `<button data-p="${k}" class="${k === HIST.period ? "on" : ""}">${l}</button>`).join("")}</span>
    ${Object.entries(inputs).map(([k, h]) => `<span class="hin" data-p="${k}" ${k === HIST.period ? "" : "hidden"}>${h}</span>`).join("")}</div>
    <div id="h-body"><div class="hload"><div class="spin"></div>Завантаження…</div></div>`;
}

function initHistory() {
  const el = document.getElementById("hist");
  if (el.dataset.ready) return;
  el.dataset.ready = "1";
  el.innerHTML = histControls();
  el.querySelectorAll("#h-period button").forEach(b => b.onclick = () => {
    HIST.period = b.dataset.p;
    el.querySelectorAll("#h-period button").forEach(x => x.classList.toggle("on", x === b));
    el.querySelectorAll(".hin").forEach(x => x.hidden = x.dataset.p !== HIST.period);
    loadHistory();
  });
  el.querySelectorAll("#h-kind button").forEach(b => b.onclick = () => {
    HIST.kind = b.dataset.k;
    el.querySelectorAll("#h-kind button").forEach(x => x.classList.toggle("on", x === b));
    renderHistory();
  });
  el.querySelectorAll(".hin input, .hin select").forEach(i => i.onchange = loadHistory);
  loadHistory();
}

async function loadHistory() {
  const [f, t] = histRange(), key = `${f}|${t}`;
  const body = document.getElementById("h-body");
  if (!body) return;
  body.innerHTML = `<div class="hload"><div class="spin"></div>Завантаження…</div>`;
  try {
    HIST.data = await api("/api/range", {from: f, to: t}); HIST.key = key;
    renderHistory();
  } catch (e) { body.innerHTML = `<span class="muted small">Не вдалося завантажити: ${esc(e.message)}</span>`; }
}

const dayLabel = ms => new Date(ms).toLocaleDateString("uk-UA", {weekday: "short", day: "2-digit", month: "2-digit"});

function renderHistory() {
  const D = HIST.data, body = document.getElementById("h-body");
  if (!D || !body) return;
  if (D.error) { body.innerHTML = `<span class="muted">${esc(D.error)}</span>`; return; }
  const days = D.days.filter(d => d.day <= D.now);
  if (!days.length) { body.innerHTML = `<span class="muted">Немає даних за цей період</span>`; return; }
  document.getElementById("hist").classList.remove("rankview");
  document.getElementById("h-extra").innerHTML = "";  // перемикач «Мої регіони / Рейтинг» — лише для тривог
  body.innerHTML = HIST.kind === "power" ? histPower(D, days) : HIST.kind === "alerts" ? histAlerts(D, days)
    : HIST.kind === "vacuum" ? histVacuum(D, days) : histWeather(D, days);
}

function histPower(D, days) {
  const sum = k => days.reduce((a, d) => a + (d[k] || 0), 0);
  const n = days.reduce((a, d) => a + d.outages, 0), planned = days.filter(d => d.plan).length;
  // порівнюємо лише дні, де є графік і стеження, і графік — тільки за час, що вже минув
  const cmp = days.filter(d => d.plan && d.observed);
  const diff = cmp.reduce((a, d) => a + d.fact_off_h - d.plan_seen_h, 0);
  const diffTxt = cmp.length ? `${diff >= 0 ? "+" : "−"}${hfmt(Math.abs(diff))}` : "—";
  const head = `<div class="hsum">
    <div><small>Без світла (факт)</small><b>${hfmt(sum("fact_off_h"))}</b><span>${n} відключ. · за ${days.length} дн.</span></div>
    <div><small>За графіком ДТЕК</small><b>${hfmt(sum("plan_off_h"))}</b><span>${sum("plan_maybe_h") ? `+ можливо ${hfmt(sum("plan_maybe_h"))} · ` : ""}графік є за ${planned} дн.</span></div>
    <div><small>Факт − графік</small><b>${diffTxt}</b><span>${sum("unknown_h") ? `невідомо ${hfmt(sum("unknown_h"))} (без інтернету) · ` : ""}лише за час, коли вже стежили (до зараз)</span></div></div>`;
  if (D.detail) {
    const A = {now: D.now, monitor_since: D.monitor_since, off: D.off || [], unknown: D.unknown || []};
    const rows = days.map(d => `<div class="sched-day"><div class="lbl">${esc(dayLabel(d.day))}<span>факт ${hfmt(d.fact_off_h)} · графік ${hfmt(d.plan_off_h)}</span></div>
      <div class="bars"><span class="cap">ДТЕК</span>${d.slots ? `<div class="bar48">${d.slots.map(s => `<i class="${s === "on" ? "" : s}"></i>`).join("")}</div>` : `<div class="fact"></div>`}
      <span class="cap">Факт</span>${factBar(d.day, A)}</div></div>`).join("");
    return head + rows + `<div class="ticks">${[0,3,6,9,12,15,18,21].map(h => `<span class="${h % 6 ? "x" : ""}">${String(h).padStart(2,"0")}:00</span>`).join("")}</div>
      <div class="legend"><span><i></i>світло є</span><span><i class="off"></i>світла немає</span><span><i class="maybe"></i>можливе (ДТЕК)</span><span><i style="background:repeating-linear-gradient(45deg,var(--grid) 0 3px,transparent 3px 6px);border:1px solid var(--line)"></i>немає даних</span></div>`;
  }
  // довгий період — стовпчики по днях: графік ДТЕК (світліший) і факт (темніший), години без світла
  const W = 1000, Hh = 150, top = Math.max(4, ...days.map(d => Math.max(d.plan_off_h + d.plan_maybe_h, d.fact_off_h)));
  const bw = W / days.length, y = h => Hh - h / top * (Hh - 10);
  const bars = days.map((d, i) => { const x = i * bw;
    return `<rect x="${x + bw * .08}" y="${y(d.plan_off_h)}" width="${bw * .42}" height="${Hh - y(d.plan_off_h)}" fill="var(--off)" opacity=".45"><title>${dayLabel(d.day)} · графік ${hfmt(d.plan_off_h)}</title></rect>
      ${d.plan_maybe_h ? `<rect x="${x + bw * .08}" y="${y(d.plan_off_h + d.plan_maybe_h)}" width="${bw * .42}" height="${y(d.plan_off_h) - y(d.plan_off_h + d.plan_maybe_h)}" fill="var(--maybe)" opacity=".7"/>` : ""}
      <rect x="${x + bw * .5}" y="${y(d.fact_off_h)}" width="${bw * .42}" height="${Hh - y(d.fact_off_h)}" fill="var(--bad)"><title>${dayLabel(d.day)} · факт ${hfmt(d.fact_off_h)}${d.observed ? "" : " (ще не стежили)"}</title></rect>`; }).join("");
  return head + `<div class="hchart"><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">
      ${[0, .5, 1].map(f => `<line x1="0" x2="${W}" y1="${y(top * f)}" y2="${y(top * f)}" stroke="var(--grid)" vector-effect="non-scaling-stroke"/>`).join("")}${bars}</svg>
      <span class="rng">${Math.round(top)} год</span></div>${histAxis(days)}
    <div class="legend"><span><i class="off" style="opacity:.45"></i>за графіком ДТЕК</span><span><i class="maybe"></i>можливе</span><span><i style="background:var(--bad)"></i>факт без світла</span></div>`;
}

// 🤖 пилосос в історії: прибирання з архіву (хмара Dreame → ARCH#vacuum) — площа по днях і список
const VAC_KIND = {segment_cleaning: "кімнати", cleaning: "увесь дім", zone_cleaning: "зона", spot_cleaning: "точка",
  customized_cleaning: "свої налаштування", cruising_path: "патруль", cruising_point: "патруль"};
function histVacuum(D, days) {
  const R = (D.vacuum || []).slice().sort((a, b) => a.ts - b.ts);
  if (!R.length) return `<span class="muted">За цей період прибирань немає</span>`;
  const area = R.reduce((a, r) => a + (r.area || 0), 0), mins = R.reduce((a, r) => a + (r.minutes || 0), 0);
  const broken = R.filter(r => r.completed === false).length;
  const head = `<div class="hsum">
    <div><small>Прибирань</small><b>${R.length}</b><span>${broken ? `з них перервано ${broken}` : "усі завершено"}</span></div>
    <div><small>Прибрано</small><b>${area} м²</b><span>у середньому ${Math.round(area / Math.max(1, R.length - broken))} м² за раз</span></div>
    <div><small>Час роботи</small><b>${hfmt(mins / 60)}</b><span>за ${days.length} дн.</span></div></div>`;
  const per = days.map((d, i) => { const d1 = i + 1 < days.length ? days[i + 1].day : d.day + 864e5;
    const rs = R.filter(r => r.ts >= d.day && r.ts < d1); return {day: d.day, area: rs.reduce((a, r) => a + (r.area || 0), 0), n: rs.length, mins: rs.reduce((a, r) => a + (r.minutes || 0), 0)}; });
  const W = 1000, Hh = 150, top = Math.max(10, ...per.map(p => p.area)), bw = W / per.length, y = v => Hh - v / top * (Hh - 10);
  const chart = days.length > 1 ? `<div class="hchart"><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">
      ${[0, .5, 1].map(f => `<line x1="0" x2="${W}" y1="${y(top * f)}" y2="${y(top * f)}" stroke="var(--grid)" vector-effect="non-scaling-stroke"/>`).join("")}
      ${per.map((p, i) => p.n ? `<rect x="${i * bw + bw * .15}" y="${y(p.area)}" width="${bw * .7}" height="${Math.max(2, Hh - y(p.area))}" fill="var(--accent)" rx="2">
        <title>${dayLabel(p.day)} · ${p.n} прибир. · ${p.area} м² · ${p.mins} хв</title></rect>` : "").join("")}</svg>
      <span class="rng">${top} м²</span></div>${histAxis(days)}
    <div class="legend"><span><i style="background:var(--accent)"></i>прибрано за день, м²</span></div>` : "";
  const list = `<h3 class="small muted" style="margin-top:12px">Прибирання</h3><div class="vhist">${R.slice().reverse().slice(0, 60).map(r =>
    `<div><span>${fmtT(r.ts, 1)}</span><span>${r.area != null ? `${r.area} м²` : ""}</span><span>${r.minutes != null ? `${r.minutes} хв` : ""}</span>
     <span class="${r.completed === false ? "bad" : ""}">${r.completed === false ? `перервано${r.interrupt ? ` (${esc(r.interrupt.replace(/_/g, " "))})` : ""}`
       : `✅ ${esc(VAC_KIND[r.kind] || "")}${r.mop_after ? " · потім миття" : ""}`}</span></div>`).join("")}</div>`;
  return head + chart + list;
}

function histAxis(days) {
  const step = Math.max(1, Math.ceil(days.length / 8));
  const fmt = ms => days.length > 62 ? new Date(ms).toLocaleDateString("uk-UA", {month: "short"}) : new Date(ms).toLocaleDateString("uk-UA", {day: "2-digit", month: "2-digit"});
  return `<div class="haxis">${days.map((d, i) => i % step ? "" : `<span style="left:${(i + .5) / days.length * 100}%">${fmt(d.day)}</span>`).join("")}</div>`;
}


// 🚨 тривоги в історії: червоні й жовті відрізки по днях для кожного регіону (лише регіони з 🔔 у людей цієї ролі)
const shortReg = n => n.replace(/ район$/, " р-н").replace(" територіальна громада", " громада");
let alertView = "mine";
function histAlerts(D, days) {
  document.getElementById("h-extra").innerHTML = `<span class="seg" id="al-view">${[["mine", "📍 Мої регіони"], ["rank", "🏆 Рейтинг міст"]].map(([k, l]) =>
    `<button data-v="${k}" class="${k === alertView ? "on" : ""}">${l}</button>`).join("")}</span>`;
  const sw = "";
  setTimeout(() => document.querySelectorAll("#al-view button").forEach(b => b.onclick = () => {
    alertView = b.dataset.v; renderHistory(); if (alertView === "rank") loadRank(); }), 0);
  document.getElementById("hist").classList.toggle("rankview", alertView === "rank");  // у рейтингу період не потрібен
  if (alertView === "rank") { setTimeout(loadRank, 0); return sw + `<div id="rank-body"><div class="hload"><div class="spin"></div>Рахуємо рейтинг…</div></div>`; }
  return sw + histAlertsMine(D, days);
}

// 🏆 рейтинг міст > 50 тис. за тривогами за 365 днів: менше годин під тривогою — безпечніше
let RANK = null, rankAll = false;
async function loadRank() {
  const el = document.getElementById("rank-body"); if (!el) return;
  try { if (!RANK || Date.now() - RANK._at > 300000) { RANK = await api("/api/arank"); RANK._at = Date.now(); } }
  catch (e) { el.innerHTML = `<span class="muted">Не вдалося завантажити: ${esc(e.message)}</span>`; return; }
  renderRank();
}
function renderRank() {
  const el = document.getElementById("rank-body"); if (!el) return;
  const R = RANK && RANK.rank;
  if (!R || !R.cities) { el.innerHTML = `<span class="muted">Рейтинг ще не пораховано</span>`; return; }
  const rows = R.cities, act = new Set(RANK.active || []), shown = rankAll ? rows : rows.slice(0, 20);
  const maxH = Math.max(...shown.map(r => r.hours)) || 1;  // масштаб — під показані міста
  const d = s => new Date(s).toLocaleDateString("uk-UA", {day: "2-digit", month: "2-digit", year: "numeric"});
  el.innerHTML = `<div class="small muted" style="margin:0 0 8px">Міста України з населенням понад 50 тис. (оцінка Держстату 2022; окуповані не враховано) — за ${d(R.from)} – ${d(R.to)}.
      Місто під тривогою, якщо вона в його громаді, районі або області. Місце — за сумарним часом під тривогою (менше — безпечніше).</div>
    <div class="rank">${shown.map((r, i) => `<div class="rrow ${act.has(r.name) ? "now" : ""}">
      <b class="rpos">${i + 1}</b>
      <div class="rname">${esc(r.name)}<span>${esc((r.oblast || "").replace(" область", " обл."))} · ${r.pop} тис.${act.has(r.name) ? ` · <em>🚨 тривога зараз</em>` : ""}</span></div>
      <div class="rbar"><i style="width:${Math.max(1, r.hours / maxH * 100)}%"></i></div>
      <div class="rnum"><b>${Math.round(r.hours)} год</b><span>${r.n} трив. · ${r.share}% часу${r.n ? ` · ~${r.avg_min} хв` : ""}${r.partial_days ? ` · <span title="Днів, порахованих неповністю (тривог за день більше, ніж віддає джерело)">неповних днів: ${r.partial_days}</span>` : ""}${r.estimated ? ` · <span title="Частину відрізка ${r.est_from} – ${r.est_to} оцінено за середнім темпом тривог цього міста: у відкритих даних цього періоду немає">≈ оцінка</span>` : ""}</span></div>
    </div>`).join("")}</div>
    ${rows.length > 20 ? `<div class="gctl"><button id="rank-all">${rankAll ? "Лише топ-20" : `Показати всі ${rows.length} міст`}</button></div>` : ""}
    <div class="small muted">Оновлюється раз на добу. Дані: відкритий набір github.com/Vadimkin/ukrainian-air-raid-sirens-dataset і історія тривог siren.pp.ua (раз на добу, за вчора).
      «≈ оцінка» — у відкритих даних бракує частини осені 2026 р., її оцінено за темпом тривог міста.</div>`;
  const b = document.getElementById("rank-all"); if (b) b.onclick = () => { rankAll = !rankAll; renderRank(); };
}

function histAlertsMine(D, days) {
  const regs = D.alert_regions || [];
  if (!regs.length) return `<div class="muted">Немає регіонів тривог з увімкненими сповіщеннями (🔔) — додайте в боті: 🚨 Тривоги.</div>`;
  const tot = (r, k) => days.reduce((a, d) => a + (((d.alerts || {})[r] || {})[k] || 0), 0);
  const head = `<div class="hsum">${regs.map(r => {
    const n = tot(r, "n"), red = tot(r, "red_h"), yel = tot(r, "yellow_h"), all = red + yel;
    return `<div><small>${PV(esc(shortReg(r)))}</small><b>${n} трив. · ${hfmt(all)}</b>
      <span>🔴 ${hfmt(red)} · 🟡 ${hfmt(yel)}${n ? ` · у середньому ${hfmt(all / n)}` : ""}</span></div>`; }).join("")}</div>`;
  const legend = `<div class="legend"><span><i style="background:var(--bad)"></i>червона тривога</span><span><i style="background:var(--maybe)"></i>жовта тривога</span>
    <span><i style="background:var(--ok-bg);border:1px solid var(--line)"></i>тихо</span>
    <span><i style="background:repeating-linear-gradient(45deg,var(--grid) 0 3px,transparent 3px 6px);border:1px solid var(--line)"></i>немає даних / ще не настало</span></div>`;
  if (D.detail) {
    const segs = D.alert_segments || {};
    const bar = (d, r) => {
      const d0 = d.day, d1 = d.end, W = d1 - d0, pct = t => (Math.min(Math.max(t, d0), d1) - d0) / W * 100;
      const from = Math.max(d0, D.monitor_since || d0), to = Math.min(d1, D.now);
      const calm = to > from ? `<b class="calm" style="left:${pct(from)}%;width:${pct(to) - pct(from)}%"></b>` : "";
      const parts = (segs[r] || []).filter(([a, b]) => a < d1 && b > d0).map(([a, b, l]) =>
        `<b class="${l === "red" ? "red" : "yel"}" style="left:${pct(a)}%;width:${Math.max(.4, pct(b) - pct(a))}%" title="${fmtT(Math.max(a, d0))}–${hhmm(Math.min(b, d1))} · ${l === "red" ? "червона" : "жовта"}"></b>`).join("");
      return `<div class="fact abar">${calm}${parts}<span>${PV(esc(shortReg(r)))}</span></div>`;
    };
    const rows = days.map(d => {
      const al = d.alerts || {}, n = regs.reduce((a, r) => a + ((al[r] || {}).n || 0), 0);
      return `<div class="sched-day"><div class="lbl">${esc(dayLabel(d.day))}<span>${n ? `${n} трив.` : "без тривог"}</span></div>
        <div class="bars">${regs.map(r => `<span class="cap">🚨</span>${bar(d, r)}`).join("")}</div></div>`;
    }).join("");
    return head + rows + `<div class="ticks">${[0,3,6,9,12,15,18,21].map(h => `<span class="${h % 6 ? "x" : ""}">${String(h).padStart(2,"0")}:00</span>`).join("")}</div>` + legend;
  }
  // довгий період — для кожного регіону стовпчики по днях: години під тривогою (червона знизу, жовта зверху)
  const charts = regs.map(r => {
    const W = 1000, Hh = 110, top = Math.max(2, ...days.map(d => (((d.alerts || {})[r] || {}).red_h || 0) + (((d.alerts || {})[r] || {}).yellow_h || 0)));
    const bw = W / days.length, y = h => Hh - h / top * (Hh - 8);
    const bars = days.map((d, i) => { const a = (d.alerts || {})[r] || {}, red = a.red_h || 0, yel = a.yellow_h || 0; if (!red && !yel) return "";
      const x = i * bw + bw * .15, w = bw * .7;
      return `<rect x="${x}" y="${y(red)}" width="${w}" height="${Hh - y(red)}" fill="var(--bad)"><title>${dayLabel(d.day)} · 🔴 ${hfmt(red)}</title></rect>
        <rect x="${x}" y="${y(red + yel)}" width="${w}" height="${y(red) - y(red + yel)}" fill="var(--maybe)"><title>${dayLabel(d.day)} · 🟡 ${hfmt(yel)} · ${a.n || 0} трив.</title></rect>`; }).join("");
    return `<div class="small" style="margin:8px 0 2px;font-weight:600">${PV(esc(shortReg(r)))}</div>

}

function histWeather(D, days) {
  const withS = days.filter(d => d.sensor), withF = days.filter(d => d.fc);
  const avg = (arr, f) => arr.length ? arr.reduce((a, d) => a + f(d), 0) / arr.length : null;
  const fA = avg(withF, d => d.fc.avg), sA = avg(withS, d => d.sensor.avg);
  const both = days.filter(d => d.fc && d.sensor), diff = avg(both, d => d.sensor.avg - d.fc.avg);
  const pr = withF.reduce((a, d) => a + d.fc.precip, 0), rainy = withF.filter(d => d.fc.precip >= .5).length;
  const t = v => v == null ? "—" : `${v > 0 ? "" : ""}${v.toFixed(1)}°`;
  const head = `<div class="hsum">
    <div><small>Прогноз, середня</small><b>${t(fA)}</b><span>${withF.length ? `${Math.min(...withF.map(d => d.fc.min)).toFixed(0)}…${Math.max(...withF.map(d => d.fc.max)).toFixed(0)}° · ${withF.length} дн.` : "архіву прогнозу немає"}</span></div>
    <div><small>Датчик «${esc(D.sensor_name || "Назовні")}», середня</small><b>${t(sA)}</b><span>${withS.length ? `${Math.min(...withS.map(d => d.sensor.min))}…${Math.max(...withS.map(d => d.sensor.max))}° · ${withS.length} дн.` : "даних датчика немає"}</span></div>
    <div><small>Датчик − прогноз</small><b>${diff == null ? "—" : `${diff >= 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)}°`}</b><span>опади за прогнозом ${pr.toFixed(1)} мм · ${rainy} дн. з дощем</span></div></div>`;
  if (D.detail) {
    const F = Object.fromEntries(D.weather_fields.map((f, i) => [f, i]));
    const rows = days.map(d => {
      const H = d.hours || [];
      if (!H.length && !d.sensor) return `<div class="sched-day"><div class="lbl">${esc(dayLabel(d.day))}<span>немає даних</span></div><div></div></div>`;
      const all = H.map(h => h[F.temperature_2m]).concat((D.sensor_temp || []).filter(p => p[0] >= d.day && p[0] < d.end).map(p => p[1]));
      const lo = Math.floor(Math.min(...all)) - 1, hi = Math.ceil(Math.max(...all)) + 1;
      return `<div class="sched-day"><div class="lbl">${esc(dayLabel(d.day))}<span>${[d.fc && `прогноз ${d.fc.min.toFixed(0)}…${d.fc.max.toFixed(0)}°`, d.sensor && `датчик ${d.sensor.min}…${d.sensor.max}°`,
        d.fc && d.fc.precip && `${d.fc.precip} мм`, !d.fc && "прогнозу в архіві немає"].filter(Boolean).join(" · ")}</span></div>
        <div class="bars"><span class="cap">Опади</span>${rainBars(d.day, d.end, H, F, D.sensor_hum || [])}
        <span class="cap">Темп.</span>${wLine(d.day, d.end, H.map(h => [h[0], h[F.temperature_2m]]), D.sensor_temp || [], lo, hi, v => `${Math.round(v)}°`)}
        <span class="cap">Волог.</span>${wLine(d.day, d.end, H.map(h => [h[0], h[F.relative_humidity_2m]]), D.sensor_hum || [], 0, 100, v => `${Math.round(v)}%`)}</div></div>`;
    }).join("");
    return head + rows + `<div class="ticks">${[0,3,6,9,12,15,18,21].map(h => `<span class="${h % 6 ? "x" : ""}">${String(h).padStart(2,"0")}:00</span>`).join("")}</div>
      <div class="legend"><span><i style="background:none;border-top:2px dashed var(--chart);height:0;border-radius:0"></i>прогноз</span><span><i style="background:none;border-top:2px solid #ea580c;height:0;border-radius:0"></i>датчик</span><span><i style="background:#3b82f6"></i>опади, мм/год</span></div>`;
  }
  // довгий період — по днях: смуга мін…макс прогнозу (синя) і датчика (помаранчева), середні — лінії; опади — стовпчики
  const W = 1000, Hh = 160, P = 40;
  const vals = days.flatMap(d => [d.fc && d.fc.min, d.fc && d.fc.max, d.sensor && d.sensor.min, d.sensor && d.sensor.max]).filter(v => v != null);
  if (!vals.length) return head + `<div class="muted">Немає даних погоди за цей період</div>`;
  const lo = Math.floor(Math.min(...vals)) - 1, hi = Math.ceil(Math.max(...vals)) + 1, pTop = Math.max(5, ...days.map(d => d.fc ? d.fc.precip : 0));
  const bw = W / days.length, X = i => (i + .5) * bw, Y = v => 6 + (Hh - 12) * (1 - (v - lo) / (hi - lo));
  const band = (get, col) => days.map((d, i) => { const g = get(d); return g ? `<rect x="${i * bw + bw * .2}" y="${Y(g.max)}" width="${bw * .6}" height="${Math.max(1, Y(g.min) - Y(g.max))}" fill="${col}" opacity=".25"/>` : ""; }).join("");
  const line = (get, col, dash) => { let p = "", pen = "M"; days.forEach((d, i) => { const g = get(d); if (g) { p += `${pen}${X(i).toFixed(1)},${Y(g.avg).toFixed(1)}`; pen = "L"; } else pen = "M"; });
    return p ? `<path d="${p}" fill="none" stroke="${col}" stroke-width="2" ${dash ? 'stroke-dasharray="6 4"' : ""} vector-effect="non-scaling-stroke"/>` : ""; };
  const zero = lo < 0 && hi > 0 ? `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>` : "";
  const rain = days.map((d, i) => d.fc && d.fc.precip ? `<rect x="${i * bw + bw * .15}" y="${P - d.fc.precip / pTop * (P - 2)}" width="${bw * .7}" height="${d.fc.precip / pTop * (P - 2)}" fill="#3b82f6"><title>${dayLabel(d.day)} · ${d.fc.precip} мм</title></rect>` : "").join("");
  return head + `<div class="hchart"><svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${zero}
      ${band(d => d.fc, "var(--chart)")}${band(d => d.sensor, "#ea580c")}${line(d => d.fc, "var(--chart)", true)}${line(d => d.sensor, "#ea580c", false)}</svg>
      <span class="rng">${hi}°</span><span class="rng b">${lo}°</span></div>
    <div class="hchart small-h"><svg viewBox="0 0 ${W} ${P}" preserveAspectRatio="none">${rain}</svg><span class="rng">опади, до ${pTop.toFixed(0)} мм/добу</span></div>
    ${histAxis(days)}
    <div class="legend"><span><i style="background:none;border-top:2px dashed var(--chart);height:0;border-radius:0"></i>прогноз (середня; смуга — мін…макс)</span>
      <span><i style="background:none;border-top:2px solid #ea580c;height:0;border-radius:0"></i>датчик (середня; смуга — мін…макс)</span><span><i style="background:#3b82f6"></i>опади за прогнозом</span></div>`;
}

// ================= 🎮 Гра «Пляшечки»: розлий кольори так, щоб у кожній пляшечці був один колір =================
// Рівні однакові для всіх (зерно = номер рівня), кожен перевіряється розв'язувачем — нерозв'язних рівнів немає.
// Очки: за рівень 50 + 10 × кольорів, +25 якщо без «скасувати» і без допомоги. Допомога «🧪 +1 пляшечка» — 100 очок.
const G = {cap: 4, level: 1, score: 0, tubes: [], start: [], hist: [], sel: -1, moves: 0, extra: 0, clean: true, won: false,
  corked: new Set(), busy: false,
  pid: "", name: "", tg: "", top: [], me: null, ready: false};
const G_COLORS = ["#ef4444", "#3b82f6", "#22c55e", "#eab308", "#a855f7", "#f97316", "#06b6d4", "#ec4899", "#84cc16", "#78350f", "#64748b", "#1e3a8a"];
const G_EXTRA_COST = 100, G_MAX_EXTRA = 2;
const gStore = {get(k, d) { try { const v = localStorage.getItem("tuyahome.game." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tuyahome.game." + k, JSON.stringify(v)); } catch (e) {} }};

function gRng(seed) { // mulberry32 — однакова послідовність для однакового зерна
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// Складність (18.11): сходинка кожні 5 рівнів — +1 колір (1–5: 3 кольори, 6–10: 4 … з 46-го: 12),
// з 51-го — по 5 шарів у пляшечці, з 71-го — нижні шари приховані. Кожен 10-й рівень — 👑 бос:
// на 1 колір більше, усі шари, крім верхнього, приховані (відкриваються, коли до них дійти), очки ×3.
const gTier = n => Math.floor((n - 1) / 5);
const gBoss = n => n % 10 === 0;
const gColors = n => Math.min(3 + gTier(n) + (gBoss(n) ? 1 : 0), 12);
const gCapOf = n => gTier(n) >= 10 ? 5 : 4;
const gHidden = n => gBoss(n) || n > 70;
const gEmpty = n => 2;

function gTopRun(t) { if (!t.length) return 0; const c = t[t.length - 1]; let k = 0; for (let i = t.length - 1; i >= 0 && t[i] === c; i--) k++; return k; }
function gCanPour(tubes, a, b) {
  if (a === b) return false;
  const A = tubes[a], B = tubes[b];
  if (!A.length || B.length >= G.cap) return false;
  return !B.length || B[B.length - 1] === A[A.length - 1];
}
function gPour(tubes, a, b) { // скільки шарів перелилось
  const A = tubes[a], B = tubes[b], n = Math.min(gTopRun(A), G.cap - B.length);
  for (let i = 0; i < n; i++) B.push(A.pop());
  return n;
}
const gSolved = tubes => tubes.every(t => !t.length || (t.length === G.cap && t.every(c => c === t[0])));

// розв'язувач (пошук у глибину з пам'яттю станів): чи можна пройти рівень
function gSolvable(start, limit = 200000) {
  const seen = new Set(); let nodes = 0;
  const key = ts => ts.map(t => t.join(",")).sort().join("|");
  const dfs = ts => {
    if (gSolved(ts)) return true;
    if (++nodes > limit) return null;
    const k = key(ts); if (seen.has(k)) return false; seen.add(k);
    for (let a = 0; a < ts.length; a++) {
      const A = ts[a]; if (!A.length) continue;
      const uniform = A.every(c => c === A[0]);
      if (uniform && A.length === G.cap) continue;          // уже готова — не чіпаємо
      let emptyTried = false;
      for (let b = 0; b < ts.length; b++) {
        if (!gCanPour(ts, a, b)) continue;
        if (!ts[b].length) { if (uniform || emptyTried) continue; emptyTried = true; }  // однакові порожні — одна спроба
        const nx = ts.map(t => t.slice()); gPour(nx, a, b);
        const r = dfs(nx); if (r) return true; if (r === null) return null;
      }
    }
    return false;
  };
  return dfs(start.map(t => t.slice()));
}

function gGenerate(n) {
  const k = gColors(n), e = gEmpty(n);
  for (let attempt = 0; attempt < 60; attempt++) {
    const rnd = gRng(n * 7919 + attempt * 104729);
    const pool = []; for (let c = 0; c < k; c++) for (let i = 0; i < G.cap; i++) pool.push(c);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const tubes = []; for (let c = 0; c < k; c++) tubes.push(pool.slice(c * G.cap, (c + 1) * G.cap));
    if (tubes.some(t => t.every(x => x === t[0]))) continue;       // жодної готової пляшечки на старті
    for (let i = 0; i < e; i++) tubes.push([]);
    if (gSolvable(tubes) === true) return tubes;
  }
  return null;  // практично не трапляється — gLoad візьме інше зерно
}

function gPoints(n) { return (50 + 10 * gColors(n) + (gCapOf(n) - 4) * 50 + (gHidden(n) ? 40 : 0)) * (gBoss(n) ? 3 : 1); }

function gLoad(n) {
  G.cap = gCapOf(n);
  let tubes = gGenerate(n);
  for (let s = 1; !tubes && s < 5; s++) tubes = gGenerate(n + 1000 * s);
  G.level = n; G.start = tubes.map(t => t.slice()); G.tubes = tubes.map(t => t.slice());
  // приховані шари: скільки нижніх шарів у пляшечці ще не видно (верхній видно завжди)
  G.startHid = tubes.map(t => gHidden(n) && t.length ? t.length - 1 : 0); G.hid = G.startHid.slice();
  G.hist = []; G.sel = -1; G.moves = 0; G.extra = 0; G.clean = true; G.won = false; G.corked = new Set(); G.busy = false;
  GB.corkT = {}; GB.lift = {}; GB.wave = {}; GB.anim = null;
  gStore.set("level", n); gRender();
}

async function gClick(i) {
  if (G.won || G.busy) return;
  if (G.sel < 0) { if (G.tubes[i].length) G.sel = i; gRender(); return; }
  if (G.sel === i) { G.sel = -1; gRender(); return; }
  if (gCanPour(G.tubes, G.sel, i)) {
    const a = G.sel, A = G.tubes[a], n = Math.min(gTopRun(A), G.cap - G.tubes[i].length);
    G.busy = true; G.sel = -1;
    try { await gAnimatePour(a, i, n, G_COLORS[A[A.length - 1]]); } catch (e) { /* анімація — не критично */ }
    G.hist.push({tubes: G.tubes.map(t => t.slice()), hid: G.hid.slice()});
    gPour(G.tubes, a, i); G.moves++; G.busy = false;
    if (G.hid[a] >= G.tubes[a].length) G.hid[a] = Math.max(0, G.tubes[a].length - 1);
    if (gSolved(G.tubes)) return gWin();
  } else if (G.tubes[i].length) { G.sel = i; } else { G.sel = -1; }
  gRender();
}

const gWait = ms => new Promise(r => setTimeout(r, ms));
// переливання як рідини: пляшечка підлітає й нахиляється над ціллю, струмінь стікає, рівень у джерелі спадає, у цілі — росте
// ================= 🧪 Пляшечки на canvas: рідина з фізикою =================
// Як у «дорослих» реалізаціях (Unity-шейдери рідини в посудині): поверхня рідини завжди горизонтальна у світових
// координатах, як би не нахилялась пляшечка; рідина виливається лише тоді, коли рівень доходить до нижнього краю
// горлечка — отже, скільки вилилось, визначає кут нахилу (об'єм під краєм горлечка); струмінь падає по параболі
// (гравітація), у цілі поверхня хвилюється й затухає, у джерелі після повернення — легке хлюпання.
const GB = {cv: null, ctx: null, W: 0, H: 0, dpr: 1, pos: [], anim: null, wave: {}, lift: {}, corkT: {}, raf: 0, pat: null};
const B_NW = 9, B_NL = 24, B_BW = 21, B_SH = 14, B_LEN = 152;       // горлечко (пів-ширина, довжина), корпус (пів-ширина), «плечі», довжина
const B_SLOT = 62, B_ROWH = 196, B_TOPM = 64, B_LIFT = 14;
const B_POLY = (() => {   // внутрішній контур пляшечки, локальні координати: (0,0) — центр горлечка, +y — уздовж пляшечки
  const L = [[-B_NW, 0], [-B_NW, B_NL]];
  for (let i = 1; i <= 7; i++) { const t = i / 7, u = 1 - t;
    L.push([u * u * -B_NW + 2 * u * t * -B_BW + t * t * -B_BW, u * u * B_NL + 2 * u * t * B_NL + t * t * (B_NL + B_SH)]); }
  const cy = B_LEN - B_BW;
  L.push([-B_BW, cy]);
  for (let i = 1; i < 14; i++) { const a = Math.PI - i * Math.PI / 14; L.push([B_BW * Math.cos(a), cy + B_BW * Math.sin(a)]); }
  L.push([B_BW, cy]);

  return L.concat(right, [[B_NW, B_NL], [B_NW, 0]]);
})();
const polyArea = p => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; };
function clipBelow(p, Y) {     // частина многокутника нижче горизонталі Y (екранні координати: y росте вниз)
  const o = [];
  for (let i = 0; i < p.length; i++) {
    const A = p[i], B = p[(i + 1) % p.length], ia = A[1] >= Y, ib = B[1] >= Y;
    if (ia) o.push(A);
    if (ia !== ib) { const t = (Y - A[1]) / (B[1] - A[1]); o.push([A[0] + t * (B[0] - A[0]), Y]); }

}
const areaBelow = (p, Y) => { const c = clipBelow(p, Y); return c.length > 2 ? polyArea(c) : 0; };
function levelFor(p, v) {     // рівень горизонтальної поверхні, під якою рівно v об'єму
  let lo = Infinity, hi = -Infinity; for (const q of p) { lo = Math.min(lo, q[1]); hi = Math.max(hi, q[1]); }
  if (v <= 0) return hi;
  for (let k = 0; k < 26; k++) { const m = (lo + hi) / 2; if (areaBelow(p, m) > v) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
const toWorld = (p, mx, my, th) => { const c = Math.cos(th), s = Math.sin(th); return p.map(([x, y]) => [mx + x * c - y * s, my + x * s + y * c]); };
const B_FULL = areaBelow(B_POLY, B_NL + B_SH * 0.45);   // повна пляшечка: корпус + трохи «плечей»
const bUnit = () => B_FULL / G.cap;
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function lowerLip(th) { // нижній край горлечка при нахилі th (локальні координати)
  const s = Math.sin(th); return s >= 0 ? [B_NW, 0] : [-B_NW, 0];
}

  return areaBelow(w, lp[1]);
